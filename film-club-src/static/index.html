<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Family Movie Club</title>
<link rel="preload" href="/static/bungee.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/nunito-800.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/nunito-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="manifest" href="/static/manifest.json">
<script src="/static/local-club.js"></script>
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12070a">
<style>
/* ==========================================================================
   FAMILY MOVIE CLUB
   A dark theater where the pictures are the light. The film art runs edge
   to edge, chrome stays thin, cream paper appears only where there is
   something to read. Single file, no build step, no network calls.
   iPad Safari first. Animation rule: transform and opacity only.
   ========================================================================== */

@font-face { font-family: 'Bungee'; src: url('/static/bungee.woff2') format('woff2');
             font-weight: 400; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('/static/nunito-400.woff2') format('woff2');
             font-weight: 400; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('/static/nunito-700.woff2') format('woff2');
             font-weight: 700; font-display: swap; }
@font-face { font-family: 'Nunito'; src: url('/static/nunito-800.woff2') format('woff2');
             font-weight: 800; font-display: swap; }

:root {
  --night:    #12070a;
  --night-2:  #1d0d12;
  --velvet:   #5c1a22;
  --velvet-d: #381016;
  --cream:    #fdf6e7;
  --paper:    #fffaf0;
  --brass:    #f5c518;
  --brass-hi: #ffe694;
  --brass-lo: #a97d00;
  --brass-dp: #6d4f00;
  --pop:      #e0453f;
  --mint:     #3fa87a;
  --mint-lt:  #e6f5ec;
  --ink:      #2a1a14;
  --mut:      #8b7565;
  --sand:     #f0d9a8;   /* body copy on velvet */
  --sand-d:   #c9ad85;   /* secondary copy on velvet */

  --line:     rgba(245,197,24,.34);
  --line-s:   rgba(245,197,24,.18);

  --ease:     cubic-bezier(.22, 1, .36, 1);
  --spring:   cubic-bezier(.34, 1.56, .64, 1);
  --t-tap:    140ms;
  --t-el:     260ms;
  --t-view:   420ms;

  --pad:      clamp(14px, 2.4vw, 24px);
  --shell:    min(1120px, 94vw);
  --radius:   18px;
  --display:  'Bungee', 'Avenir Next Condensed', sans-serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; }
body {
  min-height: 100vh; background: var(--night); color: var(--cream);
  font-family: 'Nunito', -apple-system, "Avenir Next", sans-serif;
  font-size: 17px; line-height: 1.5; overflow-x: hidden;
}
/* backdrops are fixed ELEMENTS (never background-attachment: fixed, an iOS jank bug) */
body::before {
  content: ''; position: fixed; inset: 0; z-index: -3; pointer-events: none;
  background-image:
    radial-gradient(110% 55% at 50% -8%, #3a161d 0%, rgba(58,22,29,0) 62%),
    linear-gradient(180deg, var(--night-2) 0%, var(--night) 520px);
}
body::after {
  content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: url('/static/velvet.jpg') center top / cover no-repeat; opacity: .12;
}
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
img { display: block; max-width: 100%; }
svg.ic { width: 20px; height: 20px; flex: none; }

/* ---------- top bar: the only chrome that follows you around ---------- */
.bar {
  position: sticky; top: 0; z-index: 30;
  padding-top: env(safe-area-inset-top);
  background: rgba(14,6,9,.97);
  border-bottom: 1px solid var(--line);
  box-shadow: 0 6px 22px rgba(0,0,0,.45);
}
.bar .in {
  width: var(--shell); margin: 0 auto; min-height: 62px;
  display: flex; align-items: center; gap: 8px;
}
.brand {
  display: flex; align-items: center; gap: 9px; flex: none;
  font-family: var(--display); font-size: clamp(13px, 1.9vw, 16px); letter-spacing: .02em;
  color: var(--brass); white-space: nowrap; padding: 8px 6px 8px 0;
}
.brand i {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 32%, #fffbe6, var(--brass) 58%, var(--brass-lo));
  box-shadow: 0 0 9px 2px rgba(245,197,24,.55);
  animation: chase 1.8s linear infinite;
}
.brand i + i { animation-delay: .9s; }
@keyframes chase { 0%, 55%, 100% { opacity: 1; transform: scale(1); }
                   28% { opacity: .35; transform: scale(.86); } }
.tabs { display: flex; gap: 6px; margin-left: auto; }
.tab {
  min-height: 44px; padding: 6px 13px; border-radius: 12px;
  display: flex; align-items: center; gap: 7px;
  font-weight: 800; font-size: clamp(12.5px, 1.8vw, 14.5px); letter-spacing: .02em;
  color: #e8cfa0; border: 2px solid transparent;
  transition: transform var(--t-tap) var(--ease), background var(--t-el) linear;
}
.tab:active { transform: translateY(2px) scale(.97); }
.tab.active {
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 52%, #d9a900);
  color: #3a2400; border-color: #ffeaa8; box-shadow: 0 3px 0 var(--brass-dp);
}
@media (max-width: 640px) { .tab span { display: none; } .tab { padding: 6px 11px; } }
.sound {
  width: 40px; height: 40px; border-radius: 50%; flex: none; margin-left: 4px;
  display: flex; align-items: center; justify-content: center;
  background: rgba(0,0,0,.35); border: 2px solid rgba(245,197,24,.45);
  transition: transform var(--t-tap) var(--spring);
}
.sound:active { transform: scale(.88); }

/* focus mode: the quiz owns the whole screen */
body[data-mode="focus"] .bar { display: none; }
body[data-mode="focus"] main {
  min-height: 100vh; display: flex; flex-direction: column; justify-content: flex-start;
  padding-top: max(clamp(64px, 9vh, 120px), env(safe-area-inset-top));
}
body[data-mode="focus"] footer { display: none; }
.quit {
  position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 40;
  min-height: 42px; padding: 6px 14px 6px 10px; border-radius: 22px;
  display: flex; align-items: center; gap: 6px; font-weight: 800; font-size: 13.5px;
  background: rgba(14,6,9,.85); border: 2px solid var(--line); color: var(--sand);
}
.quit svg { width: 16px; height: 16px; }

/* ---------- shell ---------- */
main { width: var(--shell); margin: 0 auto; padding: clamp(14px, 2.2vw, 22px) 0 80px; }
.enter { animation: rise var(--t-view) var(--ease) both; animation-delay: calc(var(--i, 0) * 55ms); }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }
footer {
  text-align: center; padding: 10px 20px 34px; font-size: 11px; letter-spacing: .22em;
  text-transform: uppercase; color: #8f7466;
}

/* ---------- section labels: a marquee rule with the words in the middle ---------- */
.sec {
  display: flex; align-items: center; gap: 14px; margin: clamp(22px, 3vw, 30px) 0 14px;
  font-family: var(--display); font-size: clamp(14px, 2vw, 17px); letter-spacing: .06em;
  color: var(--brass); text-align: center;
}
.sec::before, .sec::after { content: ''; flex: 1; height: 2px; }
.sec::before { background: linear-gradient(90deg, transparent, var(--line)); }
.sec::after  { background: linear-gradient(90deg, var(--line), transparent); }
.sec .n {
  font-family: 'Nunito', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: .04em;
  color: #3a2400; background: var(--brass); border-radius: 20px; padding: 2px 10px; margin-left: 4px;
}
.sec.first { margin-top: 4px; }

/* ---------- surfaces ---------- */
.panel {
  background: linear-gradient(180deg, rgba(92,26,34,.5), rgba(40,14,19,.78));
  border: 2px solid var(--line); border-radius: var(--radius);
  box-shadow: 0 10px 28px rgba(0,0,0,.45);
}
.paper {
  background: var(--cream); color: var(--ink); border-radius: var(--radius);
  border: 2px solid rgba(56,16,22,.7); box-shadow: 0 10px 28px rgba(0,0,0,.45);
}
.pad { padding: var(--pad); }
.h2 {
  font-family: var(--display); font-weight: 400; line-height: 1.12;
  font-size: clamp(20px, 3.4vw, 28px); color: var(--brass-hi);
}
.paper .h2 { color: var(--ink); }
.k {
  display: block; font-weight: 800; font-size: 11.5px; letter-spacing: .12em;
  text-transform: uppercase; color: var(--brass); margin-bottom: 4px;
}
.paper .k { color: var(--pop); }
.note { font-size: 15px; line-height: 1.5; color: var(--sand-d); }
.paper .note { color: var(--mut); }
.center { text-align: center; }
.tapcard { transition: transform var(--t-tap) var(--ease); cursor: pointer; }
.tapcard:active { transform: scale(.985); }

/* ---------- buttons ---------- */
.big {
  display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; min-height: 62px; border-radius: 15px; padding: 14px 18px;
  font-weight: 800; font-size: clamp(16px, 2.3vw, 18px); text-transform: uppercase;
  letter-spacing: .04em; margin-top: 14px;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 52%, #d9a900);
  color: #3a2400; border: 3px solid rgba(56,16,22,.75);
  box-shadow: 0 5px 0 var(--brass-dp);
  transition: transform var(--t-tap) var(--ease), box-shadow var(--t-tap) var(--ease);
}
.big svg { width: 22px; height: 22px; flex: none; }
.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--brass-dp); }
.big:disabled { filter: grayscale(.7); opacity: .55; box-shadow: none; }
.big.ghost {
  background: rgba(0,0,0,.32); color: var(--sand); border-color: var(--line);
  box-shadow: 0 4px 0 rgba(0,0,0,.5);
}
.big.ghost:active { box-shadow: 0 1px 0 rgba(0,0,0,.5); }
.paper .big.ghost, .sheet .big.ghost, .inner .big.ghost {
  background: #fff; color: var(--ink); border-color: rgba(56,16,22,.4);
  box-shadow: 0 4px 0 rgba(56,16,22,.25);
}
.pill {
  display: inline-flex; align-items: center; gap: 7px; min-height: 42px;
  padding: 7px 16px 7px 12px; border-radius: 22px; font-weight: 800; font-size: 14px;
  background: rgba(92,26,34,.7); border: 2px solid var(--line); color: var(--sand);
  transition: transform var(--t-tap) var(--ease);
}
.pill:active { transform: scale(.96); }
.pill svg { width: 16px; height: 16px; }

/* ---------- HOME: the screening room with its sign ---------- */
.hometop { display: grid; gap: 18px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .hometop { grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr); align-items: stretch; } }

.hero {
  position: relative; border-radius: 20px; overflow: hidden;
  border: 3px solid var(--brass); box-shadow: 0 16px 40px rgba(0,0,0,.6); background: #0d0609;
}
/* the whole room as painted: no crop, no zoom */
.hero img { width: 100%; height: auto; }
.hero .fade {
  position: absolute; left: 0; right: 0; bottom: 0; height: 36%; pointer-events: none;
  background: linear-gradient(180deg, transparent, rgba(12,5,8,.82));
}
.hero .cap {
  position: absolute; left: 16px; bottom: 12px; font-weight: 800; font-size: 12px;
  letter-spacing: .16em; text-transform: uppercase; color: var(--brass-hi);
  text-shadow: 0 2px 6px #000;
}
/* the marquee sign hangs over the ceiling */
.sign {
  position: absolute; top: clamp(10px, 1.8vw, 18px); left: 50%; transform: translateX(-50%);
  width: min(600px, 88%); text-align: center; padding: 8px 20px 10px; border-radius: 16px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.07), rgba(0,0,0,.28)),
    url('/static/velvet.jpg') center / cover, var(--velvet);
  border: 3px solid var(--brass);
  box-shadow: 0 0 0 3px var(--velvet-d), 0 14px 34px rgba(0,0,0,.7), inset 0 0 50px rgba(0,0,0,.5);
}
.bulbs { display: flex; justify-content: space-between; }
.bulbs i {
  width: 9px; height: 9px; border-radius: 50%; flex: none;
  background: radial-gradient(circle at 35% 32%, #fffbe6, var(--brass) 58%, var(--brass-lo));
  box-shadow: 0 0 9px 2px rgba(245,197,24,.6);
  animation: chase 1.8s linear infinite;
}
.sign .club {
  font-weight: 800; letter-spacing: .32em; text-transform: uppercase;
  font-size: clamp(9px, 1.4vw, 11px); color: var(--brass-hi); margin-top: 7px; opacity: .92;
}
.sign .wordmark {
  font-family: var(--display); font-size: clamp(24px, 4.8vw, 42px); line-height: 1.02; margin: 2px 0 6px;
  background: linear-gradient(180deg, #fff6cf 0%, var(--brass) 46%, #d59b06 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 2px 0 var(--brass-dp)) drop-shadow(0 6px 16px rgba(0,0,0,.75));
}

/* beside (landscape) or under (portrait) the room: the wall meter and the next film */
.side { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (min-width: 1000px) { .side { grid-template-columns: 1fr; grid-auto-rows: 1fr; } }
.side .panel { display: flex; flex-direction: column; justify-content: center; padding: 16px 18px; }
.meter .h2 { font-size: clamp(17px, 2.4vw, 22px); }
.frames { display: flex; gap: 8px; margin-top: 10px; }
.frames i {
  width: 26px; height: 38px; border-radius: 3px; flex: none; position: relative;
  border: 2px solid rgba(245,197,24,.45); background: rgba(0,0,0,.4);
}
.frames i.on {
  background: linear-gradient(160deg, var(--brass-hi), var(--brass) 55%, var(--brass-lo));
  border-color: #ffeaa8; box-shadow: 0 0 12px rgba(245,197,24,.55);
}
.frames i.on::after {
  content: ''; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px;
  background: rgba(58,36,0,.6);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.nextup .ttl { font-family: var(--display); font-size: clamp(16px, 2.2vw, 21px); line-height: 1.1; color: var(--cream); }
.nextup .big { min-height: 50px; margin-top: 12px; font-size: 15px; }

/* ---------- film marquee cards: the art, then a plate ---------- */
.films { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .films { grid-template-columns: 1fr 1fr; } }
.mcard {
  border-radius: var(--radius); overflow: hidden; background: #150a0d;
  border: 2px solid rgba(245,197,24,.42); box-shadow: 0 12px 30px rgba(0,0,0,.55);
}
.art { position: relative; aspect-ratio: 21 / 9; overflow: hidden; background: #0d0609; }
.art img { width: 100%; height: 100%; object-fit: cover; }
.art .scrim {
  position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(10,4,7,.6) 0%, rgba(10,4,7,.2) 34%, transparent 52%);
}
.art .ttl {
  position: absolute; top: clamp(10px, 1.8vw, 18px); left: 16px; right: 16px; text-align: center;
  pointer-events: none;
}
.art .ttl .yr {
  font-weight: 800; font-size: clamp(12px, 1.6vw, 14px); letter-spacing: .22em;
  color: var(--brass); text-shadow: 0 2px 6px #000;
}
.art .ttl h3 {
  font-family: var(--display); font-weight: 400; line-height: 1.04;
  font-size: clamp(22px, 3.7vw, 34px); color: #fff8e6; margin-top: 2px;
  text-shadow: 0 2px 0 rgba(58,26,0,.9), 0 7px 20px rgba(0,0,0,.95), 0 0 30px rgba(0,0,0,.6);
}
.art.pos-right .ttl { left: 42%; text-align: right; }
.art.pos-left  .ttl { right: 42%; text-align: left; }
.art.tall .ttl h3 { font-size: clamp(28px, 5.2vw, 52px); }
.art.tall .ttl .yr { font-size: clamp(13px, 1.8vw, 16px); }

.plate {
  display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 9px 14px;
  background: linear-gradient(180deg, #2c1117, #1a0a0e); border-top: 1px solid var(--line-s);
}
.plate .thumb {
  width: 34px; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; flex: none;
  border: 1px solid rgba(245,197,24,.5); background: #000;
}
.plate .thumb img { width: 100%; height: 100%; object-fit: cover; }
.plate .thumb .vaultbox { width: 100%; height: 100%; border: 0; }
.plate .thumb .vaultbox .qm { font-size: 18px; }
.status { display: flex; align-items: center; gap: 7px; font-weight: 800; font-size: 14.5px; color: var(--sand); min-width: 0; }
.status svg { width: 17px; height: 17px; flex: none; }
.status.earned { color: var(--brass-hi); }
.status.wall { color: #8fe4bb; }
.plate .go {
  margin-left: auto; display: flex; align-items: center; gap: 5px; flex: none;
  font-weight: 800; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass);
}
.plate .go svg { width: 16px; height: 16px; }

/* ---------- the vault box: a locked poster reveals zero pixels ---------- */
.vaultbox {
  position: relative; overflow: hidden; isolation: isolate;
  background: radial-gradient(circle at 50% 58%, #4a2029 0%, #1b0c11 72%);
  border: 2px dashed rgba(245,197,24,.5);
  display: flex; align-items: center; justify-content: center;
}
.vaultbox::before {
  content: ''; position: absolute; inset: -30%; z-index: 0;
  background: radial-gradient(circle, rgba(245,197,24,.30), transparent 62%);
  animation: pulse 3.4s ease-in-out infinite;
}
@keyframes pulse { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: 1; transform: scale(1.14); } }
.vaultbox .qm {
  position: relative; z-index: 2; font-family: var(--display); color: var(--brass);
  font-size: clamp(34px, 6vw, 56px); text-shadow: 0 0 26px rgba(245,197,24,.85);
  animation: bob 3s ease-in-out infinite;
}
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(-5deg); } 50% { transform: translateY(-9px) rotate(5deg); } }
.vaultbox .smoke {
  position: absolute; left: -20%; width: 140%; height: 62%; z-index: 1; bottom: -14%;
  background: radial-gradient(ellipse at 50% 60%, rgba(232,182,76,.20), transparent 70%);
  animation: drift 8s ease-in-out infinite;
}
.vaultbox .smoke.b { bottom: 22%; opacity: .6; animation-duration: 11s; animation-direction: reverse; }
@keyframes drift { 0%, 100% { transform: translateX(-7%) scale(1); } 50% { transform: translateX(7%) scale(1.18); } }

/* ---------- gold frames (vault wall, celebration, lightbox) ---------- */
.frame {
  position: relative; padding: 9px; border-radius: 5px;
  background: linear-gradient(145deg, #b8860b 0%, #8a6b00 32%, #ffe694 52%, #a97d00 74%, #7a5a00 100%);
  box-shadow: 0 14px 30px rgba(0,0,0,.65);
  transition: transform var(--t-el) var(--ease);
}
.frame:active { transform: scale(.97); }
.frame .mat { background: #efe4cd; padding: 7px; border-radius: 2px; }
.frame .mat img, .frame .mat .vaultbox { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; }
.frame .mat .vaultbox { border-style: solid; border-color: rgba(245,197,24,.28); }
.nameplate {
  margin: 10px auto 0; display: flex; align-items: center; justify-content: center;
  min-height: 40px; padding: 5px 10px; border-radius: 4px;
  background: linear-gradient(180deg, #d8ae3c, #9c7415);
  color: #2a1c00; font-weight: 800; font-size: 13px; line-height: 1.2; letter-spacing: .02em;
  text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,.45);
}
.nameplate.dim { background: linear-gradient(180deg, #6b5836, #463719); color: #e3d2ad; }

/* ---------- the vault: a dark gallery room ---------- */
.room {
  position: relative; overflow: hidden;
  background:
    radial-gradient(90% 50% at 50% 0%, rgba(245,197,24,.14), transparent 60%),
    linear-gradient(180deg, rgba(92,26,34,.75), rgba(24,10,14,.96)),
    url('/static/velvet.jpg') center / cover;
  border-color: var(--brass);
}
.wall { display: flex; flex-wrap: wrap; justify-content: center; gap: clamp(18px, 3vw, 30px); padding-top: 6px; }
.slot { width: clamp(150px, 27vw, 212px); text-align: center; position: relative; cursor: pointer; }
@media (min-width: 1000px) { .slot { width: 186px; } }
.slot .spot {
  position: absolute; left: 50%; top: -90px; width: 190%; height: 170%; z-index: 0;
  transform: translateX(-50%); pointer-events: none;
  background: radial-gradient(ellipse at 50% 0%, rgba(255,232,170,.42), rgba(255,232,170,.08) 45%, transparent 62%);
}
.slot .frame, .slot .nameplate { position: relative; z-index: 1; }
.slotsub { font-size: 13.5px; color: var(--sand-d); margin-top: 6px; }

/* ---------- film page ---------- */
.backrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.detail { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: start; margin-top: 20px; }
@media (min-width: 1000px) { .detail { grid-template-columns: 380px minmax(0, 1fr); } }
.col { display: grid; gap: 20px; }
.tagline { font-size: clamp(15px, 2vw, 17px); line-height: 1.45; color: var(--sand); font-weight: 700; }
.action { display: flex; gap: 16px; align-items: center; margin-top: 14px; }
.action .shot {
  width: 104px; flex: none; aspect-ratio: 2 / 3; border-radius: 8px; overflow: hidden;
  border: 2px solid rgba(245,197,24,.55); box-shadow: 0 8px 18px rgba(0,0,0,.5);
}
.action .shot img, .action .shot .vaultbox { width: 100%; height: 100%; object-fit: cover; border: 0; }
.action .txt { flex: 1; min-width: 0; font-size: 15.5px; line-height: 1.45; color: var(--sand); }
.action .txt b { color: var(--brass-hi); }
.best { font-size: 14px; color: var(--sand-d); margin-top: 10px; text-align: center; }

.facts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fact { background: rgba(0,0,0,.3); border: 1px solid var(--line-s); border-radius: 12px; padding: 10px 12px; }
.fact b { display: block; font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--brass); margin-bottom: 3px; }
.fact span { font-size: 15.5px; line-height: 1.35; color: var(--cream); font-weight: 700; }

/* minmax(0, 1fr): a still is wider than its track and 1fr alone refuses to shrink below it,
   which pushed the whole right column over the left one on desktop widths */
.cast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; min-width: 0; }
.face { text-align: center; }
.face img { width: 100%; max-width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 22%;
  border-radius: 14px; border: 3px solid rgba(245,197,24,.4);
  transition: transform var(--t-el) var(--spring);
}
.face:active img { transform: scale(1.05); }
.face .nm { font-size: 14px; font-weight: 800; margin-top: 7px; line-height: 1.2; color: var(--cream); }
.face .ch { font-size: 13px; color: var(--sand-d); line-height: 1.25; }
.story p { font-size: 17px; line-height: 1.6; }
.trivia ul { list-style: none; margin-top: 4px; }
.trivia li {
  position: relative; padding-left: 26px; margin-bottom: 10px; font-size: 15.5px; line-height: 1.5; color: var(--sand);
}
.trivia li::before {
  content: ''; position: absolute; left: 0; top: 6px; width: 14px; height: 14px; background: var(--brass);
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.quote { text-align: center; font-style: italic; font-weight: 700; font-size: 16px; color: var(--sand); padding: 4px 8px; }
.quote span { display: block; color: var(--brass); font-style: normal; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; margin-top: 4px; }

/* cast detail inside a sheet */
.castsheet { display: flex; gap: 18px; align-items: flex-start; }
.castsheet img {
  width: clamp(120px, 24vw, 190px); aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 22%;
  border-radius: 14px; border: 3px solid var(--brass); flex: none;
}
.castsheet .who { flex: 1; min-width: 0; }
.castsheet .who h3 { font-family: var(--display); font-weight: 400; font-size: clamp(19px, 3vw, 26px); line-height: 1.1; }
.castsheet .who .role { font-weight: 800; color: var(--pop); font-size: 14px; margin-top: 2px; }
.castsheet .who p { font-size: 16px; line-height: 1.5; margin-top: 8px; }
.factlist { margin-top: 14px; }
.factlist ul { margin: 6px 0 0 20px; font-size: 15.5px; line-height: 1.55; }
.factlist li { margin-bottom: 5px; }

/* ---------- coming attractions ---------- */
.ideas { display: grid; gap: 20px; grid-template-columns: 1fr; }
@media (min-width: 1000px) { .ideas { grid-template-columns: 1fr 1fr; } }
.idea { border-radius: var(--radius); overflow: hidden; background: #150a0d; border: 2px solid rgba(245,197,24,.42); box-shadow: 0 12px 30px rgba(0,0,0,.55); }
.idea .art { aspect-ratio: 16 / 9; }
.idea .art .scrim { background: linear-gradient(180deg, transparent 50%, rgba(14,6,9,.9)); }
.idea .art .cap {
  position: absolute; left: 16px; right: 16px; bottom: 12px;
  font-family: var(--display); font-size: clamp(19px, 2.8vw, 26px); line-height: 1.05; color: #fff8e6;
  text-shadow: 0 2px 0 rgba(58,26,0,.9), 0 6px 18px rgba(0,0,0,.9);
}
.idea .art .yr {
  position: absolute; top: 12px; left: 14px; padding: 3px 11px; border-radius: 20px;
  background: rgba(12,5,8,.8); color: var(--brass); font-weight: 800; font-size: 12.5px; letter-spacing: .1em;
  border: 1.5px solid rgba(245,197,24,.5);
}
.idea .pitch { padding: 14px 16px 4px; font-size: 15.5px; line-height: 1.5; color: var(--sand); }
.tell {
  display: inline-flex; align-items: center; gap: 8px; margin: 10px 16px 16px; padding: 8px 14px; border-radius: 20px;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #3a2400; font-weight: 800; font-size: 13px;
}
.tell svg { width: 16px; height: 16px; }

/* ---------- the screening (quiz): a game show inside the theater ----------
   Pick who is playing, count in like a film leader, answer on tickets, feel
   the streak heat build on the screen, call the usher once, then watch the
   box office count up before the verdict. */
.stage { width: 100%; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
/* press-and-hold on art must never pop the iOS save-image sheet or select text */
.art img, .face img, .frame, .idea, .mcard, .dface img, .spotwrap, .tm-stage { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
.qtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.av {
  border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex: none;
  font-family: var(--display); color: #fff; background: var(--c, #6b5a4a);
  border: 2px solid rgba(255,255,255,.6); box-shadow: 0 3px 8px rgba(0,0,0,.35);
}
.av.none { background: transparent; border-style: dashed; color: var(--brass); box-shadow: none; }
.playing { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; color: var(--sand); }
.playing .av { width: 30px; height: 30px; font-size: 14px; }
.tix { display: flex; gap: 5px; margin-bottom: 14px; }
.tix i {
  flex: 1; height: 22px; border-radius: 4px; position: relative;
  background: rgba(255,255,255,.08); border: 1.5px solid rgba(245,197,24,.3);
  transition: transform var(--t-el) var(--spring), background var(--t-el) linear, border-color var(--t-el) linear;
}
.tix i::after {
  content: ''; position: absolute; inset: 0; margin: auto; width: 10px; height: 10px; opacity: 0;
  background: rgba(58,36,0,.6); transition: opacity .2s linear;
  clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
}
.tix i.right {
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); border-color: #ffeaa8;
  transform: scaleY(1.25); box-shadow: 0 0 10px rgba(245,197,24,.5);
}
.tix i.right::after { opacity: 1; }
.tix i.wrong { background: #7a1f1c; border-color: var(--pop); }
.tix i.now { border-color: var(--cream); animation: tixpulse 1.1s ease-in-out infinite; }
@keyframes tixpulse { 50% { transform: scaleY(1.25); } }
.qhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; position: relative; z-index: 2; }
.qcount { font-family: var(--display); font-size: 13px; color: var(--brass); letter-spacing: .06em; }
.streak {
  display: flex; align-items: center; gap: 5px; font-weight: 800; font-size: 13.5px; color: #ffcf6e;
  opacity: 0; transform: translateY(4px); transition: opacity var(--t-el), transform var(--t-el) var(--spring);
}
.streak svg { width: 16px; height: 16px; }
.streak.on { opacity: 1; transform: none; }
.stage.heat3 .streak { color: #ff9d3a; }
.stage.heat3 .streak svg { animation: flicker .3s steps(2) infinite; }
@keyframes flicker { 50% { transform: scale(1.25) rotate(-8deg); } }
/* the usher: one flashlight per game, points at a wrong ticket */
.usher {
  display: flex; align-items: center; gap: 6px; min-height: 42px; padding: 5px 14px 5px 10px; border-radius: 21px;
  font-weight: 800; font-size: 13.5px; color: #3a2400;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); border: 2px solid rgba(56,16,22,.6);
  box-shadow: 0 3px 0 var(--brass-dp);
  transition: transform var(--t-tap) var(--ease), box-shadow var(--t-tap) var(--ease), opacity .3s linear;
}
.usher:active { transform: translateY(3px); box-shadow: none; }
.usher:disabled { opacity: .45; box-shadow: none; filter: grayscale(.6); }
.usher svg { width: 16px; height: 16px; }
/* the screen, with a heat halo that only turns up with a streak */
.screenwrap { position: relative; }
.screen {
  position: relative; isolation: isolate; border-radius: 16px; padding: clamp(18px, 2.6vw, 26px) clamp(18px, 2.8vw, 28px);
  background: radial-gradient(120% 110% at 50% 0%, #fffdf6 0%, #f6ebd3 75%, #eddcbd 100%);
  color: var(--ink); border: 3px solid #d9c9a8;
  box-shadow: 0 0 0 4px #2a1015, 0 0 90px rgba(255,236,170,.16), 0 18px 40px rgba(0,0,0,.6);
}
.screen::before {
  content: ''; position: absolute; inset: -18px; border-radius: 26px; z-index: -1; pointer-events: none;
  background: radial-gradient(70% 90% at 50% 100%, rgba(255,120,30,.95), rgba(255,60,20,.4) 50%, transparent 76%);
  opacity: 0; transition: opacity .5s linear;
}
.stage.heat1 .screen::before { opacity: .35; }
.stage.heat2 .screen::before { opacity: .7; }
.stage.heat3 .screen::before { opacity: 1; }
.flames { position: absolute; left: 4%; right: 4%; top: -54px; height: 72px; pointer-events: none; opacity: 0; transition: opacity .4s linear; }
.stage.heat3 .flames { opacity: 1; }
.flames i {
  position: absolute; bottom: 0; width: 6.5%; height: 100%; transform-origin: 50% 100%;
  border-radius: 50% 50% 40% 40% / 90% 90% 12% 12%;
  background: linear-gradient(180deg, transparent 0%, rgba(255,90,31,.55) 28%, #ff7a2a 55%, #ffb23a 78%, #fff1a8 100%);
  animation: lick .5s ease-in-out infinite alternate;
}
@keyframes lick { from { transform: scaleY(.55) scaleX(.85) translateY(8px); } to { transform: scaleY(1.2) scaleX(1.1) translateY(-10px); } }
.qtext { font-size: clamp(21px, 3.2vw, 28px); font-weight: 800; line-height: 1.3; }
/* the tickets */
.opts { display: grid; gap: 12px; margin-top: 16px; position: relative; clip-path: inset(0 -8px -8px -8px); }
.opt {
  display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; position: relative;
  min-height: 72px; padding: 14px 18px; border-radius: 15px;
  background: var(--paper); border: 3px solid rgba(56,16,22,.35);
  font-size: clamp(16px, 2.2vw, 18.5px); line-height: 1.35; color: var(--ink);
  box-shadow: 0 4px 0 rgba(0,0,0,.5);
  transition: transform var(--t-tap) var(--ease), box-shadow var(--t-tap) var(--ease),
              border-color var(--t-el) linear, background var(--t-el) linear, opacity .35s linear;
}
.opt:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.5); }
.opt .letter {
  flex: none; width: 40px; height: 40px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 16px;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #3a2400;
}
.opt.picked { border-color: var(--brass); animation: picked .45s ease-in-out infinite alternate; }
@keyframes picked { to { transform: scale(1.025); } }
.opt.correct { background: var(--mint-lt); border-color: var(--mint); }
.opt.correct .letter { background: var(--mint); color: #fff; animation: starspin .7s var(--spring) both; }
@keyframes starspin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.45); } 100% { transform: rotate(360deg) scale(1); } }
.opt.wrong { background: #fdeceb; border-color: var(--pop); animation: shake 420ms var(--ease) both; }
.opt.wrong .letter { background: var(--pop); color: #fff; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
                   40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
.opt.dim { opacity: .5; }
.opt.out { opacity: .28; }
.opt.out .txt { text-decoration: line-through; }
.opt.out .letter { background: #b9a89a; color: #fff; }
.torch {
  position: absolute; top: -10%; left: -30%; width: 26%; height: 120%; pointer-events: none; z-index: 3;
  background: linear-gradient(90deg, transparent, rgba(255,240,180,.6), transparent);
  animation: torch .8s var(--ease) forwards;
}
@keyframes torch { to { transform: translateX(520%); } }
.explain {
  margin-top: 14px; padding: 14px 16px; border-radius: 14px; font-size: 16px; line-height: 1.5; color: var(--sand);
  background: rgba(0,0,0,.35); border: 2px solid var(--line); animation: pop 240ms var(--spring) both;
}
.explain b { color: #8fe4bb; }
@keyframes pop { from { opacity: 0; transform: scale(.95); } to { opacity: 1; transform: none; } }
@media (min-height: 900px) {
  body[data-mode="focus"] .opt { min-height: 80px; font-size: clamp(17px, 2.3vw, 19.5px); }
  body[data-mode="focus"] .qtext { font-size: clamp(23px, 3.4vw, 31px); }
}
/* the film leader count-in */
.leader { position: fixed; inset: 0; z-index: 60; background: #0b0508; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.leader .grain {
  position: absolute; inset: 0; opacity: .5;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 5px);
  animation: grain .1s steps(2) infinite;
}
@keyframes grain { 50% { opacity: .2; } }
.leader .cross {
  position: absolute; inset: 0;
  background:
    linear-gradient(90deg, transparent calc(50% - 1px), rgba(255,255,255,.16) calc(50% - 1px), rgba(255,255,255,.16) calc(50% + 1px), transparent calc(50% + 1px)),
    linear-gradient(0deg, transparent calc(50% - 1px), rgba(255,255,255,.16) calc(50% - 1px), rgba(255,255,255,.16) calc(50% + 1px), transparent calc(50% + 1px));
}
.leader .ring {
  width: min(62vw, 62vh); aspect-ratio: 1; border-radius: 50%; position: relative; overflow: hidden;
  border: 4px solid rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle, #1a0b10, #0b0508 70%);
}
.leader .sweep {
  position: absolute; inset: 0; border-radius: 50%;
  background: conic-gradient(rgba(245,197,24,.55) 0 100%);
  clip-path: polygon(50% 50%, 50% 0, 100% 0, 100% 100%, 50% 100%);
  animation: sweep .72s linear both; transform-origin: 50% 50%;
}
@keyframes sweep { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.leader .num {
  position: relative; font-family: var(--display); font-size: min(36vw, 36vh); line-height: 1; color: #fff;
  text-shadow: 0 0 40px rgba(245,197,24,.6); animation: numpop .72s var(--ease) both;
}
@keyframes numpop { from { opacity: 0; transform: scale(1.25); } 30% { opacity: 1; transform: scale(1); } to { opacity: 1; transform: scale(.94); } }
/* the box office tally */
.tally { text-align: center; }
.tally .count { font-family: var(--display); font-size: clamp(64px, 14vw, 110px); line-height: 1; color: var(--brass-hi); margin-top: 4px; }
.tally .count small { font-size: .34em; color: var(--sand-d); }
.tally .tix { max-width: 560px; margin: 16px auto 0; }
.tally .tix i { height: 30px; }
.verdict {
  margin-top: 18px; font-family: var(--display); font-size: clamp(22px, 4vw, 34px); color: var(--cream);
  opacity: 0; transform: translateY(12px); transition: opacity .4s linear, transform .4s var(--spring);
}
.verdict.on { opacity: 1; transform: none; }
.verdict.win { color: var(--brass-hi); }

/* ---------- result, cooldown, celebration ---------- */
.bigscore { font-family: var(--display); font-size: clamp(52px, 11vw, 82px); line-height: 1; color: var(--brass-hi); }
.stars { font-size: clamp(26px, 5vw, 36px); letter-spacing: 7px; color: var(--brass); margin-bottom: 4px; }
.countdown { font-family: var(--display); font-size: clamp(42px, 9vw, 62px); color: var(--cream); font-variant-numeric: tabular-nums; margin: 6px 0; }

.celebrate {
  position: fixed; inset: 0; z-index: 60; overflow: hidden;
  background: #0a0407; display: flex; align-items: center; justify-content: center;
}
.celebrate .beam {
  position: absolute; inset: 0; background: url('/static/beam.jpg') center / cover;
  opacity: 0; transform: scale(1.12); animation: beamin 900ms var(--ease) 120ms forwards;
}
@keyframes beamin { to { opacity: .55; transform: scale(1); } }
.curtain {
  position: absolute; top: 0; bottom: 0; width: 52%; z-index: 3;
  background: url('/static/velvet.jpg') center / cover, var(--velvet);
  box-shadow: 0 0 60px rgba(0,0,0,.8);
}
.curtain.l { left: 0;  transform-origin: left center;  animation: partL 1100ms var(--ease) 300ms forwards; }
.curtain.r { right: 0; transform-origin: right center; animation: partR 1100ms var(--ease) 300ms forwards; }
@keyframes partL { to { transform: translateX(-101%); } }
@keyframes partR { to { transform: translateX(101%); } }
.reveal { position: relative; z-index: 4; text-align: center; padding: 20px; }
.reveal .posterhold { opacity: 0; transform: scale(.72); animation: posterin 760ms var(--spring) 950ms forwards; }
@keyframes posterin { to { opacity: 1; transform: scale(1); } }
.reveal .frame { max-width: min(52vw, 300px); margin: 0 auto; }
.reveal .frame .mat img { max-height: 52vh; width: auto; }
.unlocktitle {
  font-family: var(--display); font-size: clamp(23px, 5vw, 42px); margin-top: 20px;
  opacity: 0; transform: translateY(22px);
  background: linear-gradient(180deg, #fff6cf, var(--brass) 52%, #d59b06);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 var(--brass-dp)) drop-shadow(0 6px 18px rgba(0,0,0,.8));
  animation: rise 620ms var(--spring) 1550ms forwards;
}
.celebrate .actions { position: relative; z-index: 5; opacity: 0; animation: rise 520ms var(--ease) 2150ms forwards; width: min(430px, 84vw); margin: 22px auto 0; }

/* ---------- lightbox, sheet, modal ---------- */
.lightbox {
  position: fixed; inset: 0; z-index: 70; background: rgba(8,3,5,.96);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 18px; animation: fade 200ms var(--ease) both;
}
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.lightbox .frame { max-width: min(88vw, 560px); animation: pop 420ms var(--spring) both; }
.lightbox .frame .mat img { max-height: 74vh; width: auto; margin: 0 auto; }
.lbbar { display: flex; gap: 12px; align-items: center; margin-top: 16px; flex-wrap: wrap; justify-content: center; }
.lbhint { font-size: 12.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass-hi); }
.lbbtn {
  padding: 10px 20px; border-radius: 22px; font-weight: 800; font-size: 14px;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #3a2400; border: 2px solid rgba(56,16,22,.6);
}

.sheetview {
  position: fixed; inset: 0; z-index: 90; background: rgba(6,3,5,.96);
  display: flex; align-items: center; justify-content: center; padding: 18px;
  animation: fade .2s var(--ease) both; overflow-y: auto;
}
.sheetview .inner {
  width: min(720px, 96vw); background: var(--cream); color: var(--ink);
  border-radius: 18px; border: 3px solid var(--brass); overflow: hidden;
  animation: pop .34s var(--spring) both; margin: auto;
}
.sheetart img { width: 100%; display: block; max-height: 44vh; object-fit: cover; }
.sheetart img.contain { object-fit: contain; background: #120a0c; }
.sheetview .txt { padding: 20px 22px 22px; }
.sheetview .txt .yr { font-family: var(--display); color: var(--pop); font-size: 15px; }
.sheetview .txt h3 { font-family: var(--display); font-weight: 400; font-size: clamp(20px, 3.4vw, 28px); line-height: 1.1; margin: 4px 0 10px; color: var(--ink); }
.sheetview .txt p { font-size: 16px; line-height: 1.55; }
.wowbox {
  background: #fff3d8; border: 2px solid rgba(245,197,24,.75); border-radius: 13px;
  padding: 13px 15px; margin-top: 14px; font-size: 15px; line-height: 1.45;
}
.wowbox b { color: var(--pop); text-transform: uppercase; font-size: 11.5px; letter-spacing: .06em; display: block; margin-bottom: 3px; }
.sheetview .close { margin: 0 22px 20px; }

.modal {
  position: fixed; inset: 0; z-index: 80; background: rgba(8,3,5,.88);
  display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade 180ms var(--ease) both;
}
.modal .sheet {
  background: var(--cream); color: var(--ink); border-radius: var(--radius);
  border: 3px solid var(--brass); padding: 24px; width: min(430px, 92vw);
  animation: pop 300ms var(--spring) both; text-align: center;
}
.modal .sheet .h2 { color: var(--ink); }
.modal input {
  width: 100%; margin-top: 14px; padding: 15px; font: inherit; font-size: 22px;
  text-align: center; letter-spacing: .3em; border-radius: 12px;
  border: 3px solid rgba(56,16,22,.35); background: var(--paper); color: var(--ink);
}
.modal .err { color: var(--pop); font-weight: 800; font-size: 13.5px; margin-top: 10px; min-height: 18px; }
.instructions { text-align: left; font-size: clamp(16px, 2.2vw, 18px); line-height: 1.55; }
.instructions li { margin: 12px 0 12px 24px; }

/* ---------- THE TIME MACHINE (timeline) ----------
   Not a page you scroll. A machine you drive: one screen, a year odometer that
   rolls through every year of a jump (longer jumps roll longer), a window with
   the stop's art, the crew's ages at that moment, and a true-scale track with a
   marker that travels the real distance. Tap Next, swipe, or tap any dot. */
.tltoggle { display: flex; gap: 10px; }
.tlseg {
  flex: 1; min-height: 52px; border-radius: 13px; padding: 8px 10px;
  font-weight: 800; font-size: clamp(13px, 2vw, 16px); line-height: 1.15;
  background: linear-gradient(180deg, rgba(92,26,34,.9), var(--velvet-d));
  color: #f0cf92; border: 2.5px solid rgba(245,197,24,.32);
  display: flex; align-items: center; justify-content: center; text-align: center;
  transition: transform var(--t-tap) var(--ease);
}
.tlseg:active { transform: translateY(2px) scale(.98); }
.tlseg svg { margin-right: 8px; }
.tlseg.on { background: linear-gradient(180deg, var(--brass-hi), var(--brass) 52%, #d9a900); color: #3a2400; border-color: #ffeaa8; box-shadow: 0 4px 0 var(--brass-dp); }
.tlhead { text-align: center; margin-bottom: 8px; }
.tlhead .note { max-width: 560px; margin: 6px auto 0; }

/* era wash: the whole screen changes character as the years roll */
.erawash { position: fixed; inset: 0; z-index: -2; pointer-events: none; }
.erawash div { position: absolute; inset: 0; opacity: 0; transition: opacity .45s linear; }
.era0 { background: radial-gradient(120% 70% at 50% 0%, #3a2a12 0%, #150d07 70%); }
.era1 { background: radial-gradient(120% 70% at 50% 0%, #26303a 0%, #0b0f14 70%); }
.era2 { background: radial-gradient(120% 70% at 50% 0%, #3d1430 0%, #140715 70%); }
.era3 { background: radial-gradient(120% 70% at 50% 0%, #10303a 0%, #05121a 70%); }

.tm {
  display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "top" "odo" "stage" "read" "ctl" "rail";
}
@media (min-width: 1000px) {
  .tm {
    grid-template-columns: minmax(0, 1.45fr) minmax(330px, 1fr);
    grid-template-areas: "top odo" "stage read" "ctl ctl" "rail rail";
    align-items: start;
  }
}
.tm-top { grid-area: top; display: flex; align-items: center; }
.tm-top .tltoggle { flex: 1; }
.tm-odo-wrap { grid-area: odo; display: flex; flex-direction: column; align-items: center; gap: 6px; }
@media (min-width: 1000px) { .tm-odo-wrap { align-items: flex-end; } }

/* the year odometer: four rolling brass wheels in a black window */
.tm-odo {
  display: inline-flex; gap: 6px; padding: 8px 12px; border-radius: 14px;
  background: #0a0507; border: 2px solid var(--line);
  box-shadow: inset 0 0 30px rgba(0,0,0,.95), 0 8px 22px rgba(0,0,0,.55);
  font-family: var(--display); font-size: clamp(42px, 6.6vw, 60px); line-height: 1; color: var(--brass);
}
.tm-col {
  width: .82em; height: 1.1em; overflow: hidden; position: relative; border-radius: 6px;
  background: linear-gradient(180deg, #17090d, #2a1015 50%, #17090d);
  box-shadow: inset 0 0 0 1px rgba(245,197,24,.18);
}
.tm-col::after {
  content: ''; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(180deg, rgba(0,0,0,.6), transparent 32%, transparent 68%, rgba(0,0,0,.6));
}
.tm-strip { will-change: transform; padding-top: .05em; }
.tm-strip span { display: block; height: 1.1em; line-height: 1.1; text-align: center; }
.tm-jump { font-weight: 800; font-size: 14.5px; color: var(--brass-hi); min-height: 22px; text-align: center; line-height: 1.3; }
.tm-jump span { color: var(--sand-d); font-weight: 700; display: block; font-size: 13px; }
@media (min-width: 1000px) { .tm-jump { text-align: right; } }

/* the window */
.tm-stage {
  grid-area: stage; position: relative; border-radius: var(--radius); overflow: hidden;
  background: #0d0609; border: 2px solid rgba(245,197,24,.45);
  box-shadow: 0 14px 34px rgba(0,0,0,.6);
  touch-action: pan-y;
}
.tm-win { aspect-ratio: 21 / 9; position: relative; }
.tm-win.wide { aspect-ratio: 16 / 9; }
@media (max-width: 999px) { .tm-win.wide { aspect-ratio: 2 / 1; } }
.tm-scene { position: absolute; inset: 0; }
.tm-scene img { width: 100%; height: 100%; object-fit: cover; }
.tm-scene img.contain { object-fit: contain; background: radial-gradient(circle at 50% 50%, #2a1015, #0d0609 75%); }
.tm-win::after { content: ''; position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 70px rgba(0,0,0,.55); }
.tm-tag {
  position: absolute; left: 12px; bottom: 10px; z-index: 2; display: flex; align-items: center; gap: 6px;
  padding: 5px 11px; border-radius: 20px; font-weight: 800; font-size: 12.5px;
  background: rgba(12,5,8,.82); color: var(--brass-hi); border: 1.5px solid rgba(245,197,24,.5);
}
.tm-tag svg { width: 14px; height: 14px; }
.tm-tag.wall { color: #8fe4bb; }
.tm-birth {
  width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; background:
    radial-gradient(circle at 18% 30%, rgba(255,230,160,.9) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 26%, rgba(255,230,160,.8) 0 2px, transparent 3px),
    radial-gradient(circle at 70% 78%, rgba(255,230,160,.7) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 28% 74%, rgba(255,230,160,.7) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 50% 12%, rgba(255,230,160,.6) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 90% 60%, rgba(255,230,160,.5) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 8% 58%, rgba(255,230,160,.5) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 50% 42%, #4a1a26, #150a0d 72%);
}
.tm-birth .row { display: flex; gap: 18px; }
.tm-birth .tm-av { width: clamp(80px, 14vw, 124px); height: clamp(80px, 14vw, 124px); font-size: clamp(36px, 6.4vw, 56px); border-width: 4px; }
.tm-birth b { font-family: var(--display); font-size: clamp(17px, 2.8vw, 26px); color: var(--brass-hi); text-shadow: 0 2px 8px #000; }
.tm-birth .tm-av { animation: hatch .6s var(--spring) both; }
@keyframes hatch { from { transform: scale(.3) rotate(-12deg); opacity: 0; } }

/* the readout */
.tm-read { grid-area: read; }
.tm-readin { display: grid; gap: 12px; align-content: start; }
.tm-readin .tm-yr { font-family: var(--display); font-size: 14px; color: var(--brass); letter-spacing: .08em; }
.tm-readin h2 { font-family: var(--display); font-weight: 400; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.08; color: var(--cream); margin-top: -8px; }
.tm-readin p { font-size: 16px; line-height: 1.5; color: var(--sand); }
.tm-wow {
  background: rgba(0,0,0,.32); border: 2px solid var(--line); border-radius: 13px;
  padding: 11px 14px; font-size: 15px; line-height: 1.45; color: var(--sand);
}
.tm-wow b { display: block; font-size: 11.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--brass); margin-bottom: 2px; }
.tm-status { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14.5px; color: var(--sand); }
.tm-status svg { width: 17px; height: 17px; flex: none; }
.tm-status.earned { color: var(--brass-hi); } .tm-status.wall { color: #8fe4bb; }
.tm-readin .pill { justify-self: start; }

/* the crew: who was around, and how old */
.tm-crew {
  display: flex; gap: 6px; justify-content: space-between; padding: 10px 8px 9px;
  border-radius: 14px; background: rgba(0,0,0,.28); border: 1px solid var(--line-s);
}
.tm-person { text-align: center; flex: 1; min-width: 0; }
.tm-av {
  width: 46px; height: 46px; border-radius: 50%; margin: 0 auto;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--display); font-size: 20px; color: #fff;
  background: var(--c, #888); border: 2px solid rgba(255,255,255,.55);
  box-shadow: 0 3px 10px rgba(0,0,0,.5);
}
.tm-person .nm { font-size: 12px; font-weight: 800; margin-top: 5px; color: var(--sand); line-height: 1.1; }
.tm-person .age {
  display: inline-block; margin-top: 4px; padding: 1px 8px; border-radius: 10px;
  font-size: 12px; font-weight: 800; background: var(--brass); color: #3a2400; white-space: nowrap;
}
.tm-person.unborn .tm-av { background: transparent; border: 2px dashed rgba(245,197,24,.45); color: rgba(245,197,24,.5); box-shadow: none; }
.tm-person.unborn .age { background: rgba(255,255,255,.08); color: var(--sand-d); }
.tm-person.born .age { background: var(--pop); color: #fff; }
.tm-person.born .tm-av { animation: hatch .6s var(--spring) both; }
.tm-crewnote { font-size: 14px; font-weight: 700; color: var(--sand-d); text-align: center; }

/* controls */
.tm-ctl { grid-area: ctl; display: grid; grid-template-columns: 1fr 2fr; gap: 12px; }
.tm-ctl .big { margin-top: 0; min-height: 58px; }

/* the track: true scale, always visible, tap any dot */
.tm-rail { grid-area: rail; padding: 6px 14px 4px; border-radius: 14px; background: rgba(0,0,0,.3); border: 1px solid var(--line-s); }
.tm-track { position: relative; height: 46px; margin: 0 12px; }
.tm-track::before {
  content: ''; position: absolute; left: 0; right: 0; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
  background: linear-gradient(90deg, var(--brass-lo), var(--brass) 50%, var(--brass-lo)); opacity: .55;
}
.tm-dot {
  position: absolute; top: 50%; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; z-index: 1;
}
.tm-dot i {
  display: block; width: 13px; height: 13px; border-radius: 50%; background: #2a1015; border: 2px solid var(--brass);
  transition: transform .2s var(--spring), background .2s linear;
}
.tm-dot.film i { border-radius: 3px; }
.tm-dot.family i { background: var(--pop); border-color: #ffb3ad; }
.tm-dot.on i { background: var(--brass); transform: scale(1.45); box-shadow: 0 0 14px rgba(245,197,24,.75); }
.tm-dot.up { margin-top: -31px; }
.tm-dot b {
  position: absolute; top: 1px; right: 3px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px;
  font-size: 10px; line-height: 16px; font-weight: 800; background: var(--brass); color: #3a2400;
}
.tm-marker {
  position: absolute; top: 50%; left: 0; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%;
  background: radial-gradient(circle at 35% 30%, #fff8d0, var(--brass) 60%, var(--brass-lo));
  box-shadow: 0 0 16px rgba(245,197,24,.85); will-change: transform; pointer-events: none; z-index: 2;
}
.tm-ticks { position: relative; height: 18px; margin: 0 12px; }
.tm-ticks span { position: absolute; transform: translateX(-50%); font-size: 11px; font-weight: 800; letter-spacing: .06em; color: var(--sand-d); }

/* leaving and arriving */
.tm-out { opacity: 0; transform: translateX(-18px); transition: opacity .2s linear, transform .22s var(--ease); }
.tm-in { animation: tmin .4s var(--ease) both; }
@keyframes tmin { from { opacity: 0; transform: translateX(22px); } to { opacity: 1; transform: none; } }

/* ---------- the rooms: one painted backdrop per part of the theater ----------
   Fixed layers crossfaded by opacity, a light parallax by transform, and a
   heavy vignette so the reading surfaces stay opaque and calm on top. */
.rooms { position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden; }
.rooms .room-bg {
  position: absolute; left: 0; right: 0; top: -12%; bottom: -12%;
  background-position: center 40%; background-size: cover;
  opacity: 0; transition: opacity .8s linear; will-change: transform, opacity;
}
.rooms .room-bg.on { opacity: .46; }
.rooms .vig {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 38%, transparent 26%, rgba(12,5,8,.5) 62%, rgba(12,5,8,.94) 100%),
    linear-gradient(180deg, rgba(12,5,8,.6), transparent 24%, transparent 66%, rgba(12,5,8,.85));
}
.bg-lobby      { background-image: url('/static/room-lobby.jpg'); }
.bg-auditorium { background-image: url('/static/room-auditorium.jpg'); }
.bg-gallery    { background-image: url('/static/room-gallery.jpg'); }
.bg-booth      { background-image: url('/static/room-booth.jpg'); }
.bg-street     { background-image: url('/static/room-street.jpg'); }

/* ---------- the curtain: once per visit, the club opens ---------- */
.intro { position: fixed; inset: 0; z-index: 100; pointer-events: none; }
.intro .curtain { animation-delay: 1.15s; animation-duration: 1.2s; }
.intro .lamp {
  position: absolute; inset: 0; z-index: 4; display: flex; align-items: center; justify-content: center;
  animation: fadeout .45s linear 1.05s forwards;
}
@keyframes fadeout { to { opacity: 0; } }
.introsign { position: static; transform: none; width: min(520px, 86vw); animation: pop .5s var(--spring) both; }

/* ---------- who is playing: the chip in the bar and the picker ---------- */
.who {
  display: flex; align-items: center; gap: 7px; min-height: 40px; padding: 4px 12px 4px 4px; border-radius: 22px;
  margin-left: 6px; flex: none; font-weight: 800; font-size: 13.5px; color: var(--sand);
  background: rgba(0,0,0,.35); border: 2px solid rgba(245,197,24,.45);
  transition: transform var(--t-tap) var(--spring);
}
.who:active { transform: scale(.94); }
.who .av { width: 30px; height: 30px; font-size: 14px; }
@media (max-width: 960px) { .who .lbl { display: none; } .who { padding-right: 4px; } }
.whosheet { width: min(560px, 94vw) !important; }
.whorow { display: flex; gap: 12px; margin-top: 18px; }
.whopick {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 16px 6px 14px; border-radius: 16px;
  background: #fff; border: 3px solid rgba(56,16,22,.22); box-shadow: 0 4px 0 rgba(56,16,22,.2);
  transition: transform var(--t-tap) var(--spring), border-color .2s linear;
}
.whopick:active { transform: scale(.93); }
.whopick .av { width: clamp(58px, 10vw, 84px); height: clamp(58px, 10vw, 84px); font-size: clamp(26px, 4.6vw, 38px); border-width: 4px; }
.whopick b { font-size: 16px; color: var(--ink); }
.whopick.on { border-color: var(--brass); box-shadow: 0 0 0 4px rgba(245,197,24,.35); }

/* ---------- crew scores on the film page: each kid's own best, no ranking ---------- */
.crewscores { display: flex; gap: 10px; margin-top: 14px; min-width: 0; }
/* the printable PDFs, under the quiz button */
.sheetlinks { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.sheetlinks a.pill { text-decoration: none; }
.cs {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px 8px;
  border-radius: 14px; background: rgba(0,0,0,.28); border: 1px solid var(--line-s);
}
.cs .av { width: 38px; height: 38px; font-size: 17px; }
.cs b { font-size: 13px; color: var(--sand); margin-top: 2px; }
.cs span { font-size: 13px; font-weight: 800; color: var(--brass-hi); }
.cs.none span { color: var(--sand-d); font-weight: 700; }
.cs.pass .av { box-shadow: 0 0 0 3px var(--brass), 0 0 14px rgba(245,197,24,.6); }

/* ---------- coming attractions: the crew votes ---------- */
.idea { position: relative; }
.vote { display: flex; align-items: center; gap: 10px; margin: 10px 16px 16px; }
.heart {
  display: inline-flex; align-items: center; gap: 8px; min-height: 46px; padding: 8px 16px 8px 12px; border-radius: 24px;
  font-weight: 800; font-size: 14px; color: var(--sand); background: rgba(0,0,0,.35); border: 2px solid var(--line);
  transition: transform var(--t-tap) var(--spring), background .2s linear;
}
.heart:active { transform: scale(.93); }
.heart svg { width: 20px; height: 20px; }
.heart.on { background: linear-gradient(180deg, #ff8a80, var(--pop)); color: #fff; border-color: #ffb3ad; }
.heart.on svg { animation: heartbeat .5s var(--spring) both; }
@keyframes heartbeat { 30% { transform: scale(1.5); } }
.voters { display: flex; align-items: center; margin-left: auto; }
.voters .av { width: 32px; height: 32px; font-size: 14px; margin-left: -8px; border-width: 2px; }
.voters .av:first-child { margin-left: 0; }
.voters .n { font-size: 13px; font-weight: 800; color: var(--sand-d); margin-left: 8px; }
.ribbon {
  position: absolute; top: 30px; right: -40px; z-index: 2; transform: rotate(35deg); padding: 5px 52px;
  background: var(--pop); color: #fff; font-weight: 800; font-size: 12px; letter-spacing: .1em; text-transform: uppercase;
  box-shadow: 0 3px 8px rgba(0,0,0,.5); pointer-events: none;
}

/* ---------- motion: cards catch the light, lamps warm up ---------- */
.mcard .art::after, .idea .art::after {
  content: ''; position: absolute; top: -20%; left: -40%; width: 24%; height: 140%; pointer-events: none;
  background: linear-gradient(90deg, transparent, rgba(255,240,200,.26), transparent);
  transform: rotate(12deg); animation: shine 1.1s var(--ease) both;
  animation-delay: calc(var(--i, 0) * 120ms + 550ms);
}
@keyframes shine { to { transform: translateX(640%) rotate(12deg); } }
.slot .spot { opacity: 0; animation: lampon 1.3s linear forwards; animation-delay: calc(var(--i, 0) * 160ms + 350ms); }
@keyframes lampon { 0% { opacity: 0; } 8% { opacity: .9; } 12% { opacity: .1; } 20% { opacity: 1; } 27% { opacity: .35; } 36% { opacity: 1; } 100% { opacity: 1; } }
.unlockby {
  font-weight: 800; font-size: clamp(16px, 2.6vw, 22px); color: var(--sand); margin-top: 8px; opacity: 0;
  animation: rise 520ms var(--ease) 1900ms forwards;
}

/* ---------- new ways to answer: word tiles, faces, swipe, sequence, dial, spot ---------- */
.lockrow { margin-top: 4px; }
.lockrow .big { animation: pop .3s var(--spring) both; }
.hidden { display: none !important; }
/* fill the blank: word tiles fly into the slot */
.slot {
  display: inline-block; min-width: 3.4em; padding: 0 10px; text-align: center; vertical-align: baseline;
  border-bottom: 5px solid var(--velvet); color: var(--velvet); line-height: 1.1; transition: color .2s linear, border-color .2s linear;
}
.slot.filled { border-bottom-color: var(--brass); }
.slot.right { color: var(--mint); border-bottom-color: var(--mint); }
.slot.wrong { color: var(--pop); border-bottom-color: var(--pop); }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 18px; }
.tile {
  min-height: 58px; padding: 12px 24px; border-radius: 14px; position: relative;
  background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: #3a2400;
  font-weight: 800; font-size: clamp(17px, 2.4vw, 20px); line-height: 1.25; text-align: center;
  border: 3px solid rgba(56,16,22,.6); box-shadow: 0 4px 0 var(--brass-dp);
  transition: transform var(--t-tap) var(--ease), box-shadow var(--t-tap) var(--ease), opacity .3s linear; will-change: transform;
}
.tile:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--brass-dp); }
.tile.used { opacity: 0; pointer-events: none; }
.tile.out { opacity: .3; text-decoration: line-through; pointer-events: none; }
.tile.dim { opacity: .4; }
.tile.correct { background: var(--mint-lt); border-color: var(--mint); color: var(--ink); }
.tile.wrong { background: #fdeceb; border-color: var(--pop); animation: shake 420ms var(--ease) both; }
.fly { position: fixed; z-index: 50; margin: 0; pointer-events: none; transition: transform .45s var(--ease); }
/* who said it: the four faces */
.faces4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 16px; }
@media (max-width: 640px) { .faces4 { grid-template-columns: repeat(2, 1fr); } }
.facebtn {
  text-align: center; border-radius: 16px; padding: 8px 8px 10px; background: rgba(0,0,0,.3);
  border: 3px solid var(--line-s); transition: transform var(--t-tap) var(--spring), border-color .2s linear, opacity .3s linear, background .2s linear;
}
.facebtn:active { transform: scale(.95); }
.facebtn img, .facebtn .av { width: 100%; aspect-ratio: 1 / 1; height: auto; object-fit: cover; object-position: 50% 22%; border-radius: 12px; border: 2px solid rgba(245,197,24,.4); }
.facebtn .av { font-size: clamp(30px, 5vw, 48px); }
.facebtn .nm { font-size: 14.5px; font-weight: 800; margin-top: 8px; color: var(--cream); line-height: 1.2; }
.facebtn.picked { border-color: var(--brass); animation: picked .45s ease-in-out infinite alternate; }
.facebtn.correct { border-color: var(--mint); background: rgba(63,168,122,.3); }
.facebtn.wrong { border-color: var(--pop); background: rgba(224,69,63,.3); animation: shake 420ms var(--ease) both; }
.facebtn.dim, .facebtn.out { opacity: .35; }
/* true or false: swipe the screen, or hit the big buttons */
.tfrow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
.tfbtn {
  min-height: 86px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 10px;
  font-family: var(--display); font-size: clamp(22px, 3.6vw, 30px); color: #fff; letter-spacing: .04em;
  border: 4px solid rgba(0,0,0,.35); box-shadow: 0 6px 0 rgba(0,0,0,.45);
  transition: transform var(--t-tap) var(--spring), opacity .3s linear, box-shadow var(--t-tap) var(--ease);
}
.tfbtn svg { width: 30px; height: 30px; }
.tfbtn.t { background: linear-gradient(180deg, #5cc596, var(--mint)); }
.tfbtn.f { background: linear-gradient(180deg, #ff7b74, var(--pop)); }
.tfbtn:active { transform: translateY(5px); box-shadow: 0 1px 0 rgba(0,0,0,.45); }
.tfbtn.lean { transform: scale(1.07); }
.tfbtn.picked { animation: picked .45s ease-in-out infinite alternate; }
.tfbtn.correct { box-shadow: 0 0 0 5px #fff8e6, 0 6px 0 rgba(0,0,0,.45); }
.tfbtn.wrong, .tfbtn.dim { opacity: .35; }
.screenwrap.swipe { touch-action: none; cursor: grab; }
.screenwrap.swipe .screen { will-change: transform; }
.screenwrap.snap .screen { transition: transform .32s var(--spring); }
.tfhint { text-align: center; font-size: 13px; font-weight: 800; color: var(--sand-d); margin-top: 10px; letter-spacing: .08em; text-transform: uppercase; }
.tfhint svg { width: 14px; height: 14px; vertical-align: -2px; }
/* put it in order: tap tiles into numbered slots */
.slots { display: grid; gap: 10px; margin-top: 16px; }
.oslot {
  display: flex; align-items: center; gap: 12px; min-height: 62px; padding: 8px 12px; border-radius: 14px; text-align: left;
  border: 3px dashed rgba(245,197,24,.4); background: rgba(0,0,0,.25); color: var(--sand-d);
  font-size: clamp(15px, 2.1vw, 17.5px); line-height: 1.3; font-weight: 700;
  transition: border-color .2s linear, background .2s linear, transform var(--t-tap) var(--ease);
}
.oslot .n { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--brass); color: #3a2400; font-family: var(--display); font-size: 15px; display: flex; align-items: center; justify-content: center; }
.oslot .txt { flex: 1; }
.oslot.filled { border-style: solid; border-color: var(--brass); background: var(--paper); color: var(--ink); cursor: pointer; }
.oslot.filled:active { transform: scale(.985); }
.oslot.right { border-color: var(--mint); background: var(--mint-lt); color: var(--ink); }
.oslot.wrong { border-color: var(--pop); background: #fdeceb; color: var(--ink); }
.oslot.right .n { background: var(--mint); color: #fff; }
.oslot.wrong .n { background: var(--pop); color: #fff; }
.bank { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.bank .tile { flex: 1 1 46%; text-align: left; font-size: clamp(15px, 2.1vw, 17px); padding: 12px 16px; min-height: 54px; }
.bank .tile .first { position: absolute; top: -11px; right: -6px; background: var(--pop); color: #fff; font-size: 11px; padding: 3px 9px; border-radius: 10px; font-family: var(--display); letter-spacing: .04em; animation: pop .3s var(--spring) both; }
.truth { margin-top: 12px; padding: 12px 16px; border-radius: 12px; background: rgba(0,0,0,.3); border: 1px solid var(--line-s); font-size: 15px; color: var(--sand); }
.truth b { color: #8fe4bb; }
.truth ol { margin: 4px 0 0 22px; }
.truth li { margin-top: 3px; }
/* the dial */
.dial { display: flex; flex-direction: column; align-items: center; margin-top: 6px; }
.gauge { width: min(400px, 76vw); position: relative; }
.gauge svg { width: 100%; height: auto; overflow: visible; display: block; }
.gauge .needle { transform-origin: 100px 100px; transition: transform .1s linear; will-change: transform; }
.gauge .needle.snap { transition: transform .9s var(--spring); }
.gauge .band { opacity: 0; transition: opacity .3s linear; }
.gauge .band.on { opacity: 1; }
.readout { font-family: var(--display); font-size: clamp(40px, 8vw, 64px); color: var(--brass-hi); line-height: 1; margin-top: -10px; transition: color .3s linear; }
.readout small { font-size: .36em; color: var(--sand-d); font-family: 'Nunito', sans-serif; font-weight: 800; margin-left: 8px; letter-spacing: .04em; }
.readout.right { color: #8fe4bb; }
.readout.wrong { color: #ff9d95; }
.range {
  width: min(520px, 92%); margin: 16px 0 6px; -webkit-appearance: none; appearance: none; height: 16px; border-radius: 8px;
  background: linear-gradient(90deg, var(--brass-lo), var(--brass)); outline: none; border: 2px solid rgba(0,0,0,.5);
}
.range::-webkit-slider-thumb {
  -webkit-appearance: none; width: 52px; height: 52px; border-radius: 50%; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #fff8d0, var(--brass) 60%, var(--brass-lo));
  border: 3px solid #3a2400; box-shadow: 0 4px 12px rgba(0,0,0,.55);
}
.range:disabled { opacity: .5; }
.dialnote { font-size: 14px; font-weight: 800; color: var(--sand-d); margin-top: 4px; text-align: center; }
.dialnote b { color: #8fe4bb; }
/* spot it: tap the picture */
.spotwrap {
  position: relative; margin-top: 16px; border-radius: 14px; overflow: hidden; cursor: crosshair; touch-action: manipulation;
  border: 3px solid rgba(245,197,24,.5); box-shadow: 0 10px 28px rgba(0,0,0,.5); background: #000; -webkit-user-select: none; user-select: none;
}
.spotwrap img { width: 100%; height: auto; display: block; pointer-events: none; }
.pin {
  position: absolute; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; pointer-events: none;
  border: 4px solid #fff; background: rgba(245,197,24,.45); box-shadow: 0 0 0 3px rgba(0,0,0,.5), 0 0 24px rgba(245,197,24,.8);
  animation: pop .25s var(--spring) both;
}
.pin::after { content: ''; position: absolute; inset: 14px; border-radius: 50%; background: #fff; }
.pin.right { border-color: #8fe4bb; background: rgba(63,168,122,.55); }
.pin.wrong { border-color: #ff9d95; background: rgba(224,69,63,.55); }
.ring {
  position: absolute; aspect-ratio: 1 / 1; border-radius: 50%; pointer-events: none; transform: translate(-50%, -50%);
  border: 4px solid #8fe4bb; box-shadow: 0 0 0 2px rgba(0,0,0,.5), 0 0 20px rgba(143,228,187,.8); animation: pop .4s var(--spring) both;
}
.ring.hint { border-style: dashed; border-color: var(--brass-hi); box-shadow: 0 0 0 2px rgba(0,0,0,.5); animation: ringpulse 1.2s ease-in-out infinite; }
@keyframes ringpulse { 50% { transform: translate(-50%, -50%) scale(1.08); opacity: .65; } }
.spotnote { text-align: center; font-size: 14px; font-weight: 800; color: var(--sand-d); margin-top: 10px; }
.qkind { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--pop); margin-bottom: 6px; }
.qkind svg { width: 14px; height: 14px; }

/* ---------- motion pass: rooms change with a breath, cards tilt under a finger ---------- */
main { transition: opacity .16s linear, transform .16s var(--ease); }
main.leaving { opacity: 0; transform: translateY(-10px); }
.tilt { transform-style: preserve-3d; will-change: transform; transition: transform .5s var(--spring); }
.tilt.live { transition: transform .08s linear; }
.tilt.live .art::after { animation: none; }
/* the member card */
.member { text-align: center; }
.member .bigav { width: 96px; height: 96px; font-size: 44px; margin: 0 auto 8px; border-width: 4px; }
.member h3 { font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4vw, 32px); line-height: 1.05; color: var(--ink); }
.member .since { font-size: 12.5px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--pop); margin-top: 2px; }
.mstats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 16px 0 6px; }
.mstat { background: #fff; border: 1px solid rgba(56,16,22,.15); border-radius: 14px; padding: 10px 6px; }
.mstat b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(24px, 4.4vw, 34px); color: var(--velvet); line-height: 1; }
.mstat span { display: block; font-size: 12px; font-weight: 800; color: var(--mut); margin-top: 4px; line-height: 1.2; }
.mfilms { text-align: left; margin-top: 10px; }
.mfilm { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid rgba(56,16,22,.12); font-size: 14.5px; font-weight: 700; }
.mfilm .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mfilm .s { color: var(--brass-lo); letter-spacing: 2px; font-size: 15px; white-space: nowrap; }
.mfilm .s.none { color: #c9b8a8; }
.mfilm .b { font-size: 12.5px; color: var(--mut); white-space: nowrap; }
.member .big { min-height: 52px; }
.member .tiny { font-size: 13px; color: var(--mut); margin-top: 6px; }
/* the leave check */
.leavecheck .h2 { font-size: clamp(20px, 3vw, 24px); }

/* ---------- the projector is off: the server is unreachable ---------- */
.offline {
  position: fixed; inset: 0; z-index: 120; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: rgba(8,3,5,.94); animation: fade .25s var(--ease) both;
}
.offline .sheet { width: min(460px, 92vw); text-align: center; }
.offline .lamp {
  width: 78px; height: 78px; border-radius: 50%; margin: 0 auto 12px; position: relative;
  background: radial-gradient(circle at 40% 35%, #3a2a12, #150d07 70%); border: 3px solid var(--brass-lo);
}
.offline .lamp::after { content: ''; position: absolute; inset: 22px; border-radius: 50%; background: #5c4a2a; animation: dimlamp 2.4s ease-in-out infinite; }
@keyframes dimlamp { 50% { opacity: .35; } }
.offline .big.ghost { margin-top: 10px; }
/* stickers: the things a kid collects */
.stickers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 14px; }
.sticker {
  display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px 9px; border-radius: 14px;
  background: #fff; border: 1px solid rgba(56,16,22,.15); text-align: center;
}
.sticker .disc {
  width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  background: radial-gradient(circle at 35% 30%, #fff8d0, var(--brass) 60%, var(--brass-lo)); color: #3a2400;
  border: 3px solid #fff; box-shadow: 0 0 0 2px var(--brass-lo), 0 6px 14px rgba(0,0,0,.25); transform: rotate(-6deg);
}
.sticker .disc svg { width: 28px; height: 28px; }
.sticker b { font-size: 12.5px; line-height: 1.15; color: var(--ink); }
.sticker span { font-size: 11.5px; line-height: 1.25; color: var(--mut); font-weight: 700; }
.sticker.locked .disc { background: transparent; border: 3px dashed rgba(56,16,22,.3); box-shadow: none; color: rgba(56,16,22,.35); transform: none; }
.sticker.locked b { color: var(--mut); }
.newsticker {
  display: inline-flex; align-items: center; gap: 12px; margin-top: 16px; padding: 10px 18px 10px 10px; border-radius: 40px;
  background: var(--cream); color: var(--ink); border: 3px solid var(--brass); box-shadow: 0 10px 30px rgba(0,0,0,.5);
  animation: pop .5s var(--spring) both; animation-delay: .3s; text-align: left;
}
.newsticker .disc { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex: none;
  background: radial-gradient(circle at 35% 30%, #fff8d0, var(--brass) 60%, var(--brass-lo)); color: #3a2400; border: 3px solid #fff; box-shadow: 0 0 0 2px var(--brass-lo); transform: rotate(-8deg); }
.newsticker .disc svg { width: 28px; height: 28px; }
.newsticker .k { color: var(--pop); margin: 0; }
.newsticker b { font-family: var(--display); font-weight: 400; font-size: 17px; display: block; line-height: 1.1; }

/* ---------- the fact sheet drawer: study mid-quiz without losing your place ----------
   Slides up over the question (transform), dims the room (opacity), scrolls inside
   itself, and never touches main, so the question, tickets and heat survive. */
.drawer-dim { position: fixed; inset: 0; z-index: 85; background: rgba(6,3,5,.72); opacity: 0; transition: opacity .25s linear; }
.drawer-dim.on { opacity: 1; }
.drawer {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 86; height: 86vh; height: 86dvh;
  border-radius: 22px 22px 0 0; background: var(--cream); color: var(--ink);
  border-top: 3px solid var(--brass); box-shadow: 0 -14px 40px rgba(0,0,0,.6);
  transform: translateY(105%); transition: transform .38s var(--ease); will-change: transform;
  display: flex; flex-direction: column;
}
.drawer.on { transform: translateY(0); }
.drawer .grab { width: 48px; height: 5px; border-radius: 3px; background: rgba(56,16,22,.3); margin: 10px auto 0; flex: none; }
.drawer .dhead { display: flex; align-items: center; gap: 10px; padding: 8px 18px 10px; border-bottom: 2px solid rgba(56,16,22,.12); flex: none; }
.drawer .dhead svg { width: 22px; height: 22px; color: var(--velvet); flex: none; }
.drawer .dhead .h2 { color: var(--ink); font-size: clamp(17px, 2.4vw, 22px); min-width: 0; }
.drawer .dhead .lbbtn { margin-left: auto; flex: none; }
.drawer .dbody { overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 16px 18px 48px; flex: 1; }
.drawer .dbody > * { max-width: 820px; margin-left: auto; margin-right: auto; }
.drawer .dsec { margin-bottom: 20px; }
.drawer .k { color: var(--pop); margin-bottom: 8px; }
.drawer .fact { background: #fff; border: 1px solid rgba(56,16,22,.15); }
.drawer .fact b { color: var(--velvet); }
.drawer .fact span { color: var(--ink); }
.drawer p { font-size: 16px; line-height: 1.55; }
.drawer .dcast { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; min-width: 0; }
.dface { text-align: left; align-self: start; }
.dface img { width: 100%; max-width: 100%; display: block; aspect-ratio: 1 / 1; object-fit: cover; object-position: 50% 22%; border-radius: 12px; border: 2px solid var(--velvet); }
.dface .nm { font-size: 14px; font-weight: 800; margin-top: 6px; line-height: 1.2; }
.dface .ch { font-size: 13px; color: var(--mut); line-height: 1.2; }
.dface p { font-size: 14px; line-height: 1.45; margin-top: 6px; display: none; }
.dface.open p { display: block; }
.drawer .trivia li { color: var(--ink); }
.nums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.numcard { background: rgba(0,0,0,.3); border: 1px solid var(--line-s); border-radius: 12px; padding: 10px 12px; }
.numcard b { display: block; font-family: var(--display); font-weight: 400; font-size: clamp(17px, 2.6vw, 24px); line-height: 1.1; color: var(--brass-hi); }
.numcard span { font-size: 13.5px; font-weight: 700; line-height: 1.3; color: var(--sand-d); display: block; margin-top: 3px; }
.drawer .numcard { background: #fff; border-color: rgba(56,16,22,.15); }
.drawer .numcard b { color: var(--velvet); }
.drawer .numcard span { color: var(--mut); }
.qtools { display: flex; gap: 8px; }
@media (max-width: 640px) { .usher .lbl { display: none; } .usher { padding: 5px 10px; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
}

/* ---------- small layout helpers ---------- */
.gap { margin-top: 12px; }
.meter .note { margin-top: 8px; font-size: 14px; }
.roomnote { margin-bottom: 16px; }
.sheetview .txt + .txt { padding-top: 0; }
.a-cast .sec { margin-top: 0; }
/* film page: one column in portrait (cast right after the quiz), two columns in landscape */
.detail .col { display: contents; }
.a-action { order: 1; } .a-cast { order: 2; } .a-facts { order: 3; }
.a-story { order: 4; } .a-trivia { order: 5; } .a-quote { order: 6; }
/* the implicit auto track would size to the panels' max-content (wider than the 380px column) and overflow
   into the other column on desktop widths; minmax(0, 1fr) pins the track to the column */
@media (min-width: 1000px) { .detail .col { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; } }
