<script>
/* ==========================================================================
   utilities
   ========================================================================== */
const $ = (h) => { const d = document.createElement('div'); d.innerHTML = h.trim(); return d.firstElementChild; };
const main = document.getElementById('main');
const LETTERS = ['A', 'B', 'C', 'D'];
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

let sid = null, questions = [], qIndex = 0, currentSlug = null, passScore = 8, results = [];
let streak = 0;

/* inline icons: emoji render as artifacts on this pipeline, SVG does not */
const svg = (d, cls) => '<svg class="' + (cls || 'ic') + '" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="' + d + '"/></svg>';
const ICON = {
  lock:   svg('M17 9V7a5 5 0 00-10 0v2H5v12h14V9h-2zm-8-2a3 3 0 016 0v2H9V7zm3 10a1.6 1.6 0 110-3.2 1.6 1.6 0 010 3.2z'),
  ticket: svg('M2 7a2 2 0 012-2h16a2 2 0 012 2v2.5a2.5 2.5 0 000 5V17a2 2 0 01-2 2H4a2 2 0 01-2-2v-2.5a2.5 2.5 0 000-5V7zm7 1v8h1.5V8H9zm4.5 0v8H15V8h-1.5z'),
  print:  svg('M7 3h10v4H7V3zM4 9h16a2 2 0 012 2v6h-4v4H6v-4H2v-6a2 2 0 012-2zm4 8v3h8v-3H8zm9-5a1 1 0 100 2 1 1 0 000-2z'),
  star:   svg('M12 2l2.9 6.3 6.9.8-5.1 4.7 1.4 6.8L12 17.3 5.9 20.6l1.4-6.8L2.2 9.1l6.9-.8L12 2z'),
  check:  svg('M9.5 17.2L4.3 12l1.7-1.7 3.5 3.5 8.5-8.5L19.7 7z'),
  arrow:  svg('M5 11h11l-4-4 1.4-1.4L19.8 12l-6.4 6.4L12 17l4-4H5z'),
  back:   svg('M19 11H8l4-4-1.4-1.4L4.2 12l6.4 6.4L12 17l-4-4h11z'),
  flame:  svg('M12 2c.6 3.6-2.4 5.2-2.4 8.4a2.4 2.4 0 004.8 0c0-1-.6-2-.6-2s3.2 1.6 3.2 5.2a5 5 0 01-10 0C7 8.6 12 7.6 12 2z'),
  mega:   svg('M3 10v4h3l5 4V6l-5 4H3zm11 2a4 4 0 00-2-3.5v7A4 4 0 0014 12zm-2-7.5v2.1c2.9.9 5 3.6 5 6.8s-2.1 5.9-5 6.8v2.1c4-1 7-4.6 7-8.9s-3-7.9-7-8.9z'),
  x:      svg('M6.2 4.8L12 10.6l5.8-5.8 1.4 1.4-5.8 5.8 5.8 5.8-1.4 1.4-5.8-5.8-5.8 5.8-1.4-1.4 5.8-5.8-5.8-5.8z'),
  film:   svg('M4 4h10a2 2 0 012 2v2.2l4-2.4v12.4l-4-2.4V18a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z'),
  magic:  svg('M12 2l1.8 4.9L19 8.7l-4.4 3.1 1 5.4L12 14.6l-3.6 2.6 1-5.4L5 8.7l5.2-1.8L12 2zm6.5 12l.9 2.4 2.6.9-2.6.9-.9 2.4-.9-2.4-2.6-.9 2.6-.9.9-2.4z'),
  torch:  svg('M6 2h8v3l-2 3v12a2 2 0 01-4 0V8L6 5V2zm2 2v.6l2 3V20h0V7.6l2-3V4H8zm9 3l4-2v2l-4 2V7zm0 4h5v2h-5v-2zm0 4l4 2v2l-4-2v-2z'),
  heart:  svg('M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.8 6.6 4.8c2 0 3.4 1 4.4 2.4 1-1.4 2.4-2.4 4.4-2.4 3.6 0 5.7 3.6 4.2 7C19.5 16.4 12 21 12 21z'),
};

/* STATIC hosting (Cloudflare Pages, any file server): static/local-club.js grades quizzes in the
   browser and keeps state in localStorage. The Python server is used when it is not loaded. */
const STATIC = !!window.LocalClub;
const ART_EXT = STATIC ? '.jpg' : '';
async function api(path, body) {
  if (STATIC) return LocalClub.api(path, body);
  try {
    const r = await fetch(path, body
      ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }
      : undefined);
    if (r.status >= 500) throw new Error('server ' + r.status);
    return await r.json();
  } catch (e) {
    showOffline();
    throw e;
  }
}
/* the server is asleep, off the Wi-Fi, or restarting: say so, offer one button */
function showOffline() {
  if (document.querySelector('.offline')) return;
  const o = $('<div class="offline"><div class="sheet paper pad"><div class="lamp"></div>' +
    '<div class="h2">The projector is off</div>' +
    '<p class="note gap">The movie club server is not answering. Make sure it is running and this device is on the same Wi-Fi, then try again.</p>' +
    '<button class="big" id="retry-online">' + ICON.arrow + 'Try again</button>' +
    '</div></div>');
  o.querySelector('#retry-online').onclick = async () => {
    S.tap();

/* ==========================================================================
   motion: cards tilt toward the finger (transform only), views leave with a
   breath before the next one enters, the member card off the who-chip
   ========================================================================== */
function tilt(el, max) {
  max = max || 7;
  el.classList.add('tilt');
  let on = false;
  const set = (e) => {
    const r = el.getBoundingClientRect();
    const px = (e.clientX - r.left) / r.width - .5, py = (e.clientY - r.top) / r.height - .5;
    el.style.transform = 'perspective(900px) rotateX(' + (-py * max * 2).toFixed(2) + 'deg) rotateY(' + (px * max * 2).toFixed(2) + 'deg) scale(1.02)';
  };
  const off = () => { on = false; el.classList.remove('live'); el.style.transform = ''; };
  el.addEventListener('pointerdown', e => { if (REDUCE()) return; on = true; el.classList.add('live'); set(e); }, { passive: true });
  el.addEventListener('pointermove', e => { if (on) set(e); }, { passive: true });
  el.addEventListener('pointerup', off, { passive: true });
  el.addEventListener('pointercancel', off, { passive: true });
  el.addEventListener('pointerleave', off, { passive: true });
}

/* ==========================================================================
   sound: fully synthesized, no asset files, iOS gesture safe
   ========================================================================== */
const S = (() => {
  let ctx = null, master = null, muted = false;
  try { muted = localStorage.getItem('fc_muted') === '1'; } catch (e) {}

  function ready() {
    if (muted) return null;
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
      master = ctx.createGain();
      master.gain.value = 0.3;
      master.connect(ctx.destination);
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }
  function note(type, f0, f1, dur, gain, delay, curve) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + (delay || 0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    if (f1 && f1 !== f0) {
      if (curve === 'exp') o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t + dur);
      else o.frequency.linearRampToValueAtTime(f1, t + dur);
    }
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(gain, t + Math.min(0.02, dur * 0.25));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  }
  function noise(dur, gain, delay, hp) {
    const c = ready(); if (!c) return;
    const t = c.currentTime + (delay || 0);
    const n = Math.max(1, Math.floor(c.sampleRate * dur));
    const buf = c.createBuffer(1, n, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp || 800;
    const g = c.createGain(); g.gain.value = gain;
    src.connect(f); f.connect(g); g.connect(master);
    src.start(t);
  }
  const C5 = 523.25, E5 = 659.25, G5 = 783.99, C6 = 1046.5, C4 = 261.63;
  return {
    get muted() { return muted; },
    unlock() { ready(); },
    setMuted(v) {
      muted = v;
      try { localStorage.setItem('fc_muted', v ? '1' : '0'); } catch (e) {}
    },
    tap()  { note('sine', 640, 640, 0.05, 0.14); },
    swish(){ noise(0.26, 0.07, 0, 700); },
    /* pitch climbs with the streak so a hot run literally sounds like climbing */
    correct(n) {
      const base = C5 * Math.pow(2, Math.min(n || 0, 7) / 12);
      note('triangle', base, base, 0.10, 0.26);
      note('triangle', base * 1.5, base * 1.5, 0.17, 0.19, 0.07);
    },
    wrong() { note('sawtooth', 210, 140, 0.28, 0.13, 0, 'exp'); },
    tick()  { note('square', 1150, 1150, 0.028, 0.07); },
    drumroll() { for (let i = 0; i < 16; i++) noise(0.05, 0.05, i * 0.045, 260); },
    fanfare() {
      [[C5, 0], [E5, 0.11], [G5, 0.22], [C6, 0.35], [G5, 0.54], [C6, 0.66]].forEach(([f, d]) => {
        note('triangle', f, f, 0.44, 0.27, d);
        note('sine', f * 2, f * 2, 0.30, 0.08, d);
      });
      noise(0.8, 0.06, 0.34, 2400);
      note('sine', C4, C4, 1.0, 0.14, 0.35);
    },
    beep(n)  { const f = n === 1 ? 1320 : 880; note('square', f, f, 0.09, 0.11); },
    projector() { for (let i = 0; i < 14; i++) noise(0.03, 0.055, i * 0.042, 1400); },
    drum()   { for (let i = 0; i < 7; i++) noise(0.05, 0.06, i * 0.085, 220); },
    thud()   { note('sine', 150, 90, 0.16, 0.16, 0, 'exp'); },
    hint()   { note('triangle', 880, 1320, 0.18, 0.18, 0, 'exp'); noise(0.3, 0.05, 0.05, 900); },
    blaze()  { noise(0.5, 0.09, 0, 500); note('sawtooth', 220, 660, 0.4, 0.12, 0, 'exp'); },
    printing() { note('sine', 523, 880, 0.34, 0.2, 0, 'exp'); },
    whoosh(d) { noise(d || 0.6, 0.08, 0, 350); },
    arrive() { note('triangle', 660, 660, 0.12, 0.2); note('triangle', 990, 990, 0.2, 0.16, 0.09); },
  };
})();

/* ==========================================================================
   confetti burst. Wall-clock lifetime plus a hard failsafe so a throttled
   or backgrounded tab can never leave the canvas behind.
   ========================================================================== */
function burst(opt) {
  opt = opt || {};
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv = document.createElement('canvas');
  cv.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:95';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const W = innerWidth, H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  document.body.appendChild(cv);
  const g = cv.getContext('2d'); g.scale(dpr, dpr);

  const N = opt.count || 110;
  const ox = opt.x != null ? opt.x : W / 2;
  const oy = opt.y != null ? opt.y : H * 0.42;
  const gold = ['#f5c518', '#ffe694', '#e8b64c', '#fff3c4'];
  const party = ['#f5c518', '#ffe694', '#e0453f', '#fdf6e7', '#6fd3b8', '#ff9d1f'];
  const pal = opt.gold ? gold : party;
  const P = [];
  for (let i = 0; i < N; i++) {
    const a = (Math.PI * 2 * i) / N + Math.random() * 0.5;
    const sp = 4 + Math.random() * 9;
    P.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
             w: 5 + Math.random() * 7, h: 8 + Math.random() * 10,
             rot: Math.random() * Math.PI, vr: (Math.random() - 0.5) * 0.35,
             c: pal[(Math.random() * pal.length) | 0] });
  }
  const LIFE_MS = 2300, HARD_MS = 4200;
  const start = performance.now();
  let raf = 0, t0 = start, done = false;
  function cleanup() {
    if (done) return;
    done = true;
    cancelAnimationFrame(raf); clearTimeout(failsafe); cv.remove();
  }
  const failsafe = setTimeout(cleanup, HARD_MS);
  (function frame(t) {
    if (done) return;
    const now = t || performance.now();
    const dt = Math.min((now - t0) / 16.67, 3); t0 = now;
    const life = 1 - (now - start) / LIFE_MS;
    if (life <= 0) return cleanup();
    g.clearRect(0, 0, W, H);
    let alive = 0;
    for (const p of P) {
      p.vy += 0.34 * dt; p.vx *= 0.995;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      if (p.y > H + 40) continue;
      alive++;
      g.save(); g.translate(p.x, p.y); g.rotate(p.rot);
      g.globalAlpha = life; g.fillStyle = p.c;
      g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      g.restore();
    }
    if (!alive) return cleanup();
    raf = requestAnimationFrame(frame);
  })(start);
}

    document.body.appendChild(m);
    const input = m.querySelector('#pc');
    setTimeout(() => input.focus(), 120);
    m.querySelector('#pcok').onclick = () => {
      const v = input.value.trim();
      if (!v) { m.querySelector('#pcerr').textContent = 'Type the code first.'; return; }
      m.remove(); resolve(v);
    };
    m.querySelector('#pccancel').onclick = () => { m.remove(); resolve(null); };
    input.addEventListener('keydown', e => { if (e.key === 'Enter') m.querySelector('#pcok').click(); });
  });
}

/* ==========================================================================
   THE TIME MACHINE
   One screen. A year odometer rolls through every year of a jump, the window
   shows the stop, the crew shows how old everyone was, and a true-scale track
   shows where you are. The rejected versions were all pages you scroll with
   years as the spine; this is a machine you drive.
   ========================================================================== */
const ERAS = {
  movies: { spans: [[0, 1989], [1990, 2009], [2010, 3000]], idx: [0, 2, 3] },
  tech:   { spans: [[0, 1926], [1927, 1934], [1935, 1976], [1977, 3000]], idx: [0, 1, 2, 3] },
};
function plural(n, word) { return n + ' ' + word + (n === 1 ? '' : 's'); }
function ord(ev) { return ev.kind === 'family' ? 0 : ev.kind === 'film' ? 1 : ev.kind === 'ref' ? 2 : 3; }

function avatar(p, extra) {
  return '<div class="tm-av ' + (extra || '') + '" style="--c:' + (crewColor(p.name) || '#888') + '">' +
    esc(p.name[0]) + '</div>';
}
/* who was around at this year, and how old */
function crewHTML(year, people) {
  if (!people.length) return '';
  const born = people.filter(p => p.year <= year);
  let h = '<div class="tm-crew">';
  people.forEach(p => {
    const age = year - p.year;
    const cls = age < 0 ? 'unborn' : age === 0 ? 'born' : '';
    const label = age < 0 ? 'not yet' : age === 0 ? 'born!' : (age === 1 ? '1 year old' : age + ' years old');
    h += '<div class="tm-person ' + cls + '">' + avatar(p) +
      '<div class="nm">' + esc(p.name) + '</div><div class="age">' + label + '</div></div>';
  });
  h += '</div>';
  if (!born.length) {
    const first = Math.min(...people.map(p => p.year));
    h += '<div class="tm-crewnote">' + plural(first - year, 'year') + ' before Mom and Dad were born</div>';
  }
  return h;
}
/* one line version for the tech reel, where the crew is mostly not born yet */
function crewLine(year, people) {
  if (!people.length) return '';
  const first = Math.min(...people.map(p => p.year));
  if (year < first) return plural(first - year, 'year') + ' before Mom and Dad were born.';
  const parts = [], unborn = [];
  const seen = new Set();
  people.forEach(p => {
    if (seen.has(p.name)) return;
    const twin = people.find(q => q !== p && q.year === p.year && !seen.has(q.name));
    const who = twin ? p.name + ' and ' + twin.name : p.name;
    if (twin) seen.add(twin.name); seen.add(p.name);
    const age = year - p.year;
    if (age < 0) unborn.push(who);
    else if (age === 0) parts.push(who + ' ' + (twin ? 'were' : 'was') + ' born this year!');
    else parts.push(who + ' ' + (twin ? 'were ' : 'was ') + age);
  });
  if (unborn.length) {
    const list = unborn.length > 1 ? unborn.slice(0, -1).join(', ') + ' and ' + unborn[unborn.length - 1] : unborn[0];
    parts.push(list + ': not born yet');
  }
  return parts.join('. ') + '.';
}

function jumpNote(from, to, people, endYear) {
  const d = to - from, abs = Math.abs(d);
  if (d === 0) return 'Same year!';
  if (abs === 1) return d > 0 ? 'The very next year' : 'One year back';
  const oldest = people.filter(p => p.name !== 'Mom' && p.name !== 'Dad').sort((a, b) => a.year - b.year)[0];
  const oldestAge = oldest ? endYear - oldest.year : 0;
  let cmp = '';
  if (oldestAge && abs > oldestAge) cmp = '<span>Longer than ' + esc(oldest.name) + ' has been alive!</span>';
  else if (abs >= 5) cmp = '<span>' + (d > 0 ? 'Fast forward' : 'Rewind') + '</span>';
  return plural(abs, 'year') + (d > 0 ? ' later' : ' earlier') + cmp;
}

async function showTimeline(which) {
  setTab('timeline'); setMode('browse'); setRoom(''); scrollTop();
  const [tl, fd] = await Promise.all([api('/api/timeline'), api('/api/films')]);
  const lock = {};
  (fd.films || []).forEach(f => { lock[f.slug] = f; });
  const set = tl[which] || {};
  const people = (tl.people || []).slice().sort((a, b) => a.year - b.year);
  const stops = (set.events || []).slice().sort((a, b) => a.year - b.year || ord(a) - ord(b));
  const endYear = Math.max(set.end || 0, stops.length ? stops[stops.length - 1].year : 0);
  if (which === 'movies') stops.push({ year: endYear, kind: 'today', title: 'Today', yearLabel: 'Now' });
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  main.innerHTML = '';
  const toggle = '<div class="tltoggle">' +
    '<button class="tlseg' + (which === 'movies' ? ' on' : '') + '" id="seg-movies">' + ICON.film + 'Our Movies</button>' +
    '<button class="tlseg' + (which === 'tech' ? ' on' : '') + '" id="seg-tech">' + ICON.magic + 'Movie Magic</button>' +
    '</div>';
  if (!stops.length) {
    main.appendChild($('<div class="tm-top">' + toggle + '</div>'));
    main.appendChild($('<div class="panel pad center gap"><p class="note">This machine is still being built. Check back soon!</p></div>'));
    wireToggle();
    return;
  }
  const startYear = Math.min(set.start || stops[0].year, stops[0].year);
  const span = Math.max(1, endYear - startYear);

  const cols = Array.from({ length: 4 }, () =>
    '<div class="tm-col"><div class="tm-strip">' +
    Array.from({ length: 11 }, (_, d) => '<span>' + (d % 10) + '</span>').join('') + '</div></div>').join('');
  const tm = $('<div class="tm">' +
    '<div class="tm-top">' + toggle + '</div>' +
    '<div class="tm-odo-wrap"><div class="tm-odo" id="odo">' + cols + '</div><div class="tm-jump" id="jump"></div></div>' +
    '<div class="tm-stage"><div class="tm-win' + (which === 'tech' ? ' wide' : '') + '" id="win"></div></div>' +
    '<div class="tm-read" id="read"></div>' +
    '<div class="tm-ctl"><button class="big ghost" id="prev">' + ICON.back + 'Back</button>' +
      '<button class="big" id="next">Next stop' + ICON.arrow + '</button></div>' +
    '<div class="tm-rail"><div class="tm-track" id="track"><div class="tm-marker" id="marker"></div></div>' +
      '<div class="tm-ticks" id="ticks"></div></div>' +
    '</div>');
  main.appendChild(tm);
  function wireToggle() {
    const a = document.getElementById('seg-movies'), b = document.getElementById('seg-tech');
    if (a) a.onclick = () => { S.tap(); go('#/timeline'); };
    if (b) b.onclick = () => { S.tap(); go('#/timeline/tech'); };
  }
  wireToggle();

  /* era wash behind everything */
  let wash = document.getElementById('erawash');
  if (!wash) {
    wash = $('<div class="erawash" id="erawash"><div class="era0"></div><div class="era1"></div>' +
             '<div class="era2"></div><div class="era3"></div></div>');
    document.body.appendChild(wash);
  }
  const washLayers = [...wash.children];
  const eras = ERAS[which] || ERAS.movies;
  function washFor(y) {
    let ei = 0;
    eras.spans.forEach((rg, i) => { if (y >= rg[0] && y <= rg[1]) ei = eras.idx[i]; });
    washLayers.forEach((L, i) => { L.style.opacity = (i === ei ? 1 : 0); });
  }

  /* the track: one dot per year that has stops, decade labels underneath */
  const track = tm.querySelector('#track'), marker = tm.querySelector('#marker'), ticks = tm.querySelector('#ticks');
  const pct = y => ((y - startYear) / span * 100).toFixed(3) + '%';
  const years = [...new Set(stops.map(s => s.year))];
  let lastX = -1e9, lastUp = false;
  years.forEach(y => {
    const first = stops.findIndex(s => s.year === y);
    const x = (y - startYear) / span * 100;
    const crowded = (x - lastX) < 1.7;
    const up = crowded && !lastUp;
    lastX = x; lastUp = up;
    const n = stops.filter(s => s.year === y).length;
    const kind = stops[first].kind;
    const d = $('<button class="tm-dot ' + kind + (up ? ' up' : '') + '" data-y="' + y + '" style="left:' + pct(y) + '" aria-label="' + y + '">' +
      '<i></i>' + (n > 1 ? '<b>' + n + '</b>' : '') + '</button>');
    d.onclick = () => { S.tap(); jumpTo(first); };
    track.appendChild(d);
  });
  const step = span > 80 ? 20 : 10;
  for (let y = Math.ceil(startYear / step) * step; y <= endYear; y += step) {
    ticks.appendChild($('<span style="left:' + pct(y) + '">' + y + '</span>'));
  }
  const xOf = y => (y - startYear) / span * track.clientWidth;

  /* the odometer: each wheel only turns while the wheel below it passes 9 */
  const strips = [...tm.querySelectorAll('.tm-strip')];
  function setOdo(v) {
    for (let i = 0; i < 4; i++) {
      const pow = Math.pow(10, 3 - i);
      const q = v / pow;
      const d = Math.floor(q) % 10;
      const lower = v - Math.floor(q) * pow;
      const carry = pow === 1 ? (v - Math.floor(v)) : Math.min(Math.max(lower - (pow - 1), 0), 1);
      strips[i].style.transform = 'translateY(' + (-(d + carry) * 1.1).toFixed(4) + 'em)';
    }
  }
  function setYear(y) {
    setOdo(y);
    marker.style.transform = 'translateX(' + xOf(y).toFixed(1) + 'px)';
    washFor(y);
  }

  /* rolling from one year to the next: wall-clock timed, failsafe lands it */
  function roll(from, to, dur) {
    return new Promise(res => {
      if (dur <= 0 || reduce) { setYear(to); return res(); }
      const t0 = performance.now();
      let done = false, lastY = Math.floor(from);
      const many = Math.abs(to - from) > 24;
      const finish = () => { if (done) return; done = true; clearTimeout(fs); setYear(to); res(); };
      const fs = setTimeout(finish, dur + 500);
      (function f(t) {
        if (done) return;
        if (!document.body.contains(tm)) return finish();
        const k = Math.min((t - t0) / dur, 1);
        const e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
        const v = from + (to - from) * e;
        setOdo(v);
        marker.style.transform = 'translateX(' + xOf(v).toFixed(1) + 'px)';
        washFor(v);
        const fy = Math.floor(v);
        if (fy !== lastY) { if (!many || fy % 2 === 0) S.tick(); lastY = fy; }
        if (k >= 1) finish(); else requestAnimationFrame(f);
      })(t0);
    });
  }

  /* what the window shows at a stop */
  function sceneHTML(st) {
    if (which === 'tech') return st.img ? '<img src="/static/' + encodeURIComponent(st.img) + '" alt="">' : '';
    if (st.kind === 'film') {
      const f = lock[st.slug] || {};
      const tag = f.printed ? '<div class="tm-tag wall">' + ICON.check + 'Poster on our wall</div>'
        : f.unlocked ? '<div class="tm-tag">' + ICON.star + 'Poster earned</div>'
        : '<div class="tm-tag">' + ICON.lock + 'Poster locked</div>';
      return '<img src="/banner/' + encodeURIComponent(st.slug) + ART_EXT + '" alt="">' + tag;
    }
    if (st.kind === 'ref') return '<img class="contain" src="/static/' + encodeURIComponent(st.img) + '" alt="">';
    if (st.kind === 'today') return '<img class="contain" src="/static/hero.jpg" alt="">';
    if (st.kind === 'family') {
      const subs = people.filter(p => (st.subjects || []).includes(p.name));
      return '<div class="tm-birth"><div class="row">' + subs.map(p => avatar(p)).join('') + '</div>' +
        '<b>Welcome aboard!</b></div>';
    }
    return '';
  }
  /* what the readout says */
  function readHTML(st) {
    let h = '<div class="tm-yr">' + esc(st.yearLabel || st.year) + '</div><h2>' + esc(st.title) + '</h2>';
    if (which === 'tech') {
      h += '<p>' + esc(st.body || '') + '</p>';
      if (st.wow) h += '<div class="tm-wow"><b>Wow!</b>' + esc(st.wow) + '</div>';
      h += '<div class="tm-crewnote">' + esc(crewLine(st.year, people)) + '</div>';
      return h;
    }
    if (st.kind === 'film') {
      const f = lock[st.slug] || {};
      h += '<p>' + esc(st.note || f.tagline || '') + '</p>';
      h += f.printed ? '<div class="tm-status wall">' + ICON.check + 'Printed and framed on the wall</div>'
        : f.unlocked ? '<div class="tm-status earned">' + ICON.star + 'Poster earned, ready to print</div>'
        : '<div class="tm-status">' + ICON.lock + 'Beat the quiz to earn the poster</div>';
      h += crewHTML(st.year, people);
      h += '<button class="pill" data-go="#/film/' + esc(st.slug) + '">' + ICON.film + 'Open this film</button>';
      return h;
    }
    if (st.kind === 'family') {
      h += '<p>' + esc(st.note || 'A brand new member joins the crew.') + '</p>' + crewHTML(st.year, people);
      return h;
    }
    if (st.kind === 'today') {
      if (people.length) {
        const ages = people.filter(p => p.year > 1990).map(p => p.name + ' is ' + (st.year - p.year));
        h += '<p>' + esc(ages.join(', ') + '. Every movie on this machine came out before ' +
          (people.filter(p => p.name !== 'Mom' && p.name !== 'Dad').sort((a, b) => a.year - b.year)[0] || { name: 'anyone here' }).name + ' was born. What do we watch next?') + '</p>';
      } else {
        h += '<p>Every movie we have studied, in order. What do we watch next?</p>';
      }
      h += crewHTML(st.year, people);
      h += '<button class="pill" data-go="#/explorer">' + ICON.mega + 'Pick the next film</button>';
      return h;
    }
    h += '<p>' + esc(st.note || '') + '</p>' + crewHTML(st.year, people);
    return h;
  }

  const win = tm.querySelector('#win'), read = tm.querySelector('#read'), jump = tm.querySelector('#jump');
  const prev = tm.querySelector('#prev'), next = tm.querySelector('#next');
  let cur = 0, busy = false;

  function render(i, note) {
    const st = stops[i];
    win.innerHTML = '<div class="tm-scene tm-in">' + sceneHTML(st) + '</div>';
    read.innerHTML = '<div class="tm-readin tm-in">' + readHTML(st) + '</div>';
    jump.innerHTML = note;
    read.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { S.tap(); go(b.dataset.go); });
    win.onclick = (st.kind === 'film' && which !== 'tech') ? () => { S.tap(); go('#/film/' + st.slug); } : null;
    win.style.cursor = win.onclick ? 'pointer' : '';
    track.querySelectorAll('.tm-dot').forEach(d => d.classList.toggle('on', parseInt(d.dataset.y, 10) === st.year));
    prev.disabled = i === 0;
    next.disabled = i === stops.length - 1;
    next.innerHTML = (i === stops.length - 1 ? 'End of the line' : 'Next stop') + ICON.arrow;
  }

  async function jumpTo(i) {
    if (busy || i === cur || i < 0 || i >= stops.length) return;
    busy = true; prev.disabled = next.disabled = true;
    const from = stops[cur].year, to = stops[i].year;
    const yrs = Math.abs(to - from);
    const dur = yrs === 0 ? 320 : Math.min(2400, 320 + yrs * 85);
    win.firstElementChild && win.firstElementChild.classList.add('tm-out');
    read.firstElementChild && read.firstElementChild.classList.add('tm-out');
    jump.innerHTML = yrs ? 'Traveling ' + plural(yrs, 'year') + '...' : 'Same year!';
    if (yrs) S.whoosh(Math.min(dur / 1000, 1.4));
    await roll(from, to, dur);
    cur = i;
    render(i, jumpNote(from, to, people, endYear));
    const st = stops[i];
    if (st.kind === 'family') { S.correct(4); burst({ count: 70, y: innerHeight * 0.45 }); }
    else if (st.kind === 'today') { S.fanfare(); burst({ count: 90, gold: true, y: innerHeight * 0.4 }); }
    else S.arrive();
    busy = false;
  }

  prev.onclick = () => { S.tap(); jumpTo(cur - 1); };
  next.onclick = () => { S.tap(); jumpTo(cur + 1); };
  /* swipe the window */
  let sx = null;
  const stage = tm.querySelector('.tm-stage');
  stage.addEventListener('touchstart', e => { sx = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    if (sx == null) return;
    const dx = e.changedTouches[0].clientX - sx; sx = null;
    if (dx < -50) jumpTo(cur + 1); else if (dx > 50) jumpTo(cur - 1);
  }, { passive: true });
  window.addEventListener('resize', () => { if (!busy && document.body.contains(tm)) setYear(stops[cur].year); }, { passive: true });

  setYear(stops[0].year);
  render(0, which === 'movies' ? 'Where our story starts' : 'Where movies begin');
  window.TM = { jumpTo, stops };
}

async function route() {
  const w = document.getElementById('erawash');
  if (w) [...w.children].forEach(L => { L.style.opacity = 0; });
  const h = location.hash || '#/';
  if (main.children.length && !REDUCE()) { main.classList.add('leaving'); await wait(150); main.classList.remove('leaving'); }
  try {
    if (h.startsWith('#/film/')) return await showFilmPage(decodeURIComponent(h.slice(7)));
    if (h === '#/timeline/tech') return await showTimeline('tech');
    if (h === '#/timeline') return await showTimeline('movies');
    if (h === '#/vault') return await showVault();
    if (h === '#/explorer') return await showExplorer();
    return await showFilms();
  } catch (e) { /* api() already raised the projector-is-off screen */ }
}

async function showExplorer(keepY) {

  const ideas = data.ideas || [], votes = data.votes || {};
  if (data.kids) KIDS = data.kids;

        (voters.length ? '<span class="n">' + voters.length + '</span>' : '') + '</div></div></div>');

      e.stopPropagation();

      await ensureKids();
      const who = await pickWho({ title: 'Who is voting?', note: 'Tap your name to vote for ' + idea.title + '.', kidsOnly: true });
      if (!who) return;
      S.tap();
      const r = await api('/api/vote', { title: idea.title, who });
      if (r.votes) {
        if (r.votes[idea.title] && r.votes[idea.title].includes(who)) {
          S.correct(2);
          const b = heart.getBoundingClientRect();
          burst({ count: 24, x: b.left + b.width / 2, y: b.top + b.height / 2 });
        }
        const y = window.scrollY;
        await showExplorer(true);

}

  const fg = Array.isArray(facts.pairs) ? facts.pairs.slice() : [];

    if (facts.year) fg.push(['Year it came out', facts.year]);
    if (facts.runtime) fg.push(['How long it is', facts.runtime]);

/* ==========================================================================
   THE SCREENING (quiz): a game show. Pick who is playing, count in like a
   film leader, answer on tickets, feel the streak heat, call the usher once,
   then watch the box office count up before the verdict.
   ========================================================================== */
let wasLocked = true;   /* set before a run so a replay does not re-stage the big premiere */
let hintUsed = false, playingAs = '';
const heatFor = s => s >= 5 ? 3 : s >= 3 ? 2 : s >= 2 ? 1 : 0;
const streakLabel = () => (streak >= 5 ? 'ON FIRE! ' : '') + streak + ' in a row';

let stickersBefore = null;
async function startQuiz(f) {
  currentSlug = f.slug;
  if (f.wasLocked !== undefined) wasLocked = f.wasLocked;
  await ensureKids();
  if (!whoStored() && KIDS.length) {
    const w = await pickWho({ note: 'Scores are kept for each of you. Pick your name, or play together.' });
    if (w === null) return;
  }
  playingAs = getWho();
  let data;
  try { data = await api('/api/start', { slug: f.slug, who: playingAs, fixed: !!window.DEV_FIXED }); } catch (e) { return; }
  if (data.cooldown) return showCooldown(f, data.cooldown);
  sid = data.sid; questions = data.questions; qIndex = 0; streak = 0; hintUsed = false;
  await loadSheet(f.slug);   /* the faces and the drawer both read it */
  stickersBefore = null;
  if (playingAs) { try { stickersBefore = (await stickerSet(playingAs)).ids; } catch (e) {} }
  setMode('focus'); setRoom('auditorium'); main.innerHTML = '';
  await leader();
  renderQuestion(0, []);
}

/* the count-in: 3, 2, 1, projector */
function leader() {
  return new Promise(res => {
    if (REDUCE()) return res();
    const el = $('<div class="leader"><div class="grain"></div><div class="cross"></div><div class="ring" id="ring"></div></div>');
    document.body.appendChild(el);
    const ring = el.querySelector('#ring');
    let n = 3, done = false;
    const finish = () => { if (done) return; done = true; clearTimeout(fs); el.remove(); res(); };
    const fs = setTimeout(finish, 3400);
    (function beat() {
      if (done) return;
      if (n === 0) { S.projector(); ring.innerHTML = ''; return setTimeout(finish, 320); }
      ring.innerHTML = '<div class="sweep"></div><div class="num">' + n + '</div>';
      S.beep(n); n--; setTimeout(beat, 720);
    })();
  });
}

function tix(res, total, now) {
  let h = '<div class="tix">';
  for (let i = 0; i < total; i++) h += '<i class="' + (res[i] || (i === now ? 'now' : '')) + '"></i>';
  return h + '</div>';
}
const FLAMES = Array.from({ length: 15 }, (_, i) =>
  '<i style="left:' + (i * 6.7) + '%;animation-delay:' + (-(i * 137 % 500)) + 'ms;animation-duration:' + (380 + (i * 71) % 260) + 'ms;height:' + (60 + (i * 53) % 40) + '%"></i>').join('');

/* ---------- the seven ways to answer ----------
   Every type renders its own answer area, submits its own payload, and paints its
   own reveal. The shell around it (tickets, heat, suspense beat, feedback, tally)
   is shared. The server holds every key; the client only ever sees shuffled space. */
const KIND = {
  mc: 'Pick a ticket', blank: 'Fill the blank', who: 'Who said it?', tf: 'True or false?',
  order: 'Put it in order', number: 'Spin the dial', spot: 'Spot it',
};
const castFace = (name) => {
  const cast = (sheetData && sheetData.cast) || [];
  return cast.find(m => m.character === name || m.actor === name) || null;
};
function faceImg(name) {
  const m = castFace(name);
  return m ? '<img src="/cast/' + encodeURIComponent(currentSlug) + '/' + encodeURIComponent(m.img) + '" alt="">' : avHTML(name);
}
const fmtNum = (v, unit) => '<span>' + esc(v) + '</span>' + (unit ? '<small>' + esc(unit) + '</small>' : '');
const GAUGE_A0 = -120, GAUGE_A1 = 120;
function gaugeAngle(v, min, max) { return GAUGE_A0 + (GAUGE_A1 - GAUGE_A0) * ((v - min) / Math.max(1e-9, max - min)); }
function arcPath(a0, a1, r) {
  const p = a => [100 + r * Math.sin(a * Math.PI / 180), 100 - r * Math.cos(a * Math.PI / 180)];
  const [x0, y0] = p(a0), [x1, y1] = p(a1);
  return 'M' + x0.toFixed(2) + ' ' + y0.toFixed(2) + ' A' + r + ' ' + r + ' 0 ' + (a1 - a0 > 180 ? 1 : 0) + ' 1 ' + x1.toFixed(2) + ' ' + y1.toFixed(2);
}
function gaugeSVG(min, max) {
  let ticks = '';
  for (let i = 0; i <= 8; i++) {
    const a = GAUGE_A0 + (GAUGE_A1 - GAUGE_A0) * i / 8, big = i % 2 === 0;
    const r0 = big ? 66 : 72, r1 = 80;
    const s = Math.sin(a * Math.PI / 180), c = Math.cos(a * Math.PI / 180);
    ticks += '<line x1="' + (100 + r0 * s).toFixed(1) + '" y1="' + (100 - r0 * c).toFixed(1) + '" x2="' + (100 + r1 * s).toFixed(1) + '" y2="' + (100 - r1 * c).toFixed(1) + '" stroke="#f5c518" stroke-width="' + (big ? 3 : 2) + '" stroke-linecap="round" opacity=".8"/>';
    if (big) {
      const v = Math.round(min + (max - min) * i / 8);
      ticks += '<text x="' + (100 + 54 * s).toFixed(1) + '" y="' + (100 - 54 * c + 4).toFixed(1) + '" text-anchor="middle" font-family="Nunito" font-weight="800" font-size="9" fill="#c9ad85">' + v + '</text>';
    }
  }
  return '<svg viewBox="0 0 200 128" aria-hidden="true">' +
    '<path d="' + arcPath(GAUGE_A0, GAUGE_A1, 80) + '" fill="none" stroke="#2a1015" stroke-width="16" stroke-linecap="round"/>' +
    '<path d="' + arcPath(GAUGE_A0, GAUGE_A1, 80) + '" fill="none" stroke="rgba(245,197,24,.35)" stroke-width="10" stroke-linecap="round"/>' +
    '<path class="band" id="band" d="" fill="none" stroke="#8fe4bb" stroke-width="10" stroke-linecap="round"/>' +
    ticks +
    '<g class="needle" id="needle"><polygon points="96,102 100,30 104,102" fill="#ffe694"/><circle cx="100" cy="100" r="9" fill="#ffe694" stroke="#3a2400" stroke-width="3"/></g>' +
    '</svg>';
}

/* what sits under the screen for each type */
function slotLabel(k, n) {

  return 'Tap the tile that comes ' + w;

      '<div class="lockrow hidden" id="lockrow"><button class="big" id="lock">' + ICON.check + 'Lock it in</button></div>';
  }
  return '';

/* wire the answer area: every path ends in commit() */
function wireType(q, stage) {
  const t = q.type || 'mc';
  const lockrow = stage.querySelector('#lockrow'), lock = stage.querySelector('#lock');
  if (t === 'mc') {
    stage.querySelectorAll('.opt').forEach(b => b.onclick = () => commit(q, { choice: +b.dataset.j }, b));
  } else if (t === 'blank') {
    const slot = stage.querySelector('#slot');
    stage.querySelectorAll('.tile').forEach(b => b.onclick = async () => {
      stage.querySelectorAll('.tile').forEach(x => x.onclick = null);
      S.swish();
      await flyTo(b, slot);
      slot.textContent = b.textContent; slot.classList.add('filled');
      commit(q, { choice: +b.dataset.j }, slot);
    });
  } else if (t === 'who') {
    stage.querySelectorAll('.facebtn').forEach(b => b.onclick = () => commit(q, { choice: +b.dataset.j }, b));
  } else if (t === 'tf') {
    const btns = [...stage.querySelectorAll('.tfbtn')];
    btns.forEach(b => b.onclick = () => commit(q, { value: b.dataset.v === 'true' }, b));
    wireSwipe(stage, q, btns);
  } else if (t === 'order') {
    const slots = [...stage.querySelectorAll('.oslot')], tiles = [...stage.querySelectorAll('.bank .tile')];
    // a slot is reserved the instant a tile is tapped, not when it lands: two fast taps
    // used to claim the same slot and strand a tile invisible (the "three tiles for four slots" bug)
    const placed = q.items.map(() => null), flying = new Set();
    const sync = () => {
      const full = placed.every(x => x !== null) && flying.size === 0;
      lockrow.classList.toggle('hidden', !full);
      if (full) S.correct(1);
    };
    function armTile(tl) {
      tl.onclick = async () => {
        const k = placed.indexOf(null); if (k < 0) return;
        S.tap(); tl.onclick = null;
        placed[k] = +tl.dataset.j; flying.add(k);
        try { await flyTo(tl, slots[k]); } catch (e) {}
        flying.delete(k); tl.classList.add('used');
        slots[k].classList.add('filled'); slots[k].querySelector('.txt').textContent = tl.textContent;
        sync();
      };
    }
    tiles.forEach(armTile);
    slots.forEach((sl, k) => sl.onclick = () => {
      if (placed[k] === null || flying.has(k)) return;
      S.tap();
      const j = placed[k]; placed[k] = null;
      sl.classList.remove('filled'); sl.querySelector('.txt').textContent = slotLabel(k, placed.length);
      const tl = tiles.find(x => +x.dataset.j === j); tl.classList.remove('used'); armTile(tl);
      sync();
    });
    lock.onclick = () => { if (flying.size || placed.some(x => x === null)) return; slots.forEach(s => s.onclick = null); tiles.forEach(x => x.onclick = null); commit(q, { order: placed.slice() }, lock); };
  } else if (t === 'number') {
    const range = stage.querySelector('#range'), readout = stage.querySelector('#readout'), needle = stage.querySelector('#needle');
    const paint = () => {
      const v = +range.value;
      readout.innerHTML = fmtNum(v, q.unit);
      needle.style.transform = 'rotate(' + gaugeAngle(v, q.min, q.max).toFixed(2) + 'deg)';
    };
    let lastTick = 0;
    range.addEventListener('input', () => { paint(); const n = performance.now(); if (n - lastTick > 70) { S.tick(); lastTick = n; } });
    paint();
    lock.onclick = () => { range.disabled = true; commit(q, { value: +range.value }, lock); };
  } else if (t === 'spot') {
    const wrap = stage.querySelector('#spot');
    let pin = null, pos = null;
    wrap.addEventListener('pointerdown', e => {
      if (pos && pos.locked) return;
      const r = wrap.getBoundingClientRect();
      const x = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)), y = Math.min(1, Math.max(0, (e.clientY - r.top) / r.height));
      pos = { x, y };
      if (!pin) { pin = $('<div class="pin"></div>'); wrap.appendChild(pin); }
      else { pin.style.animation = 'none'; }
      pin.style.left = (x * 100) + '%'; pin.style.top = (y * 100) + '%';
      S.tap(); lockrow.classList.remove('hidden');
      stage.querySelector('#spotnote').textContent = 'Not sure? Tap again to move your mark.';
    });
    lock.onclick = () => { if (!pos) return; pos.locked = true; commit(q, { x: pos.x, y: pos.y }, lock); };
  }
}

/* a tile lifts off and lands on its slot (FLIP, transform only) */
function flyTo(from, to) {
  return new Promise(res => {
    if (REDUCE()) return res();
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const ghost = from.cloneNode(true);
    ghost.classList.add('fly');
    ghost.style.cssText = 'left:' + a.left + 'px;top:' + a.top + 'px;width:' + a.width + 'px;height:' + a.height + 'px;';
    document.body.appendChild(ghost);
    from.style.visibility = 'hidden';
    const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
    let done = false;
    const finish = () => { if (done) return; done = true; ghost.remove(); from.style.visibility = ''; res(); };
    requestAnimationFrame(() => { ghost.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px) scale(.92)'; });
    ghost.addEventListener('transitionend', finish, { once: true });
    setTimeout(finish, 650);
  });
}

/* true or false: drag the screen itself */
function wireSwipe(stage, q, btns) {
  const wrap = stage.querySelector('.screenwrap'), screen = stage.querySelector('.screen');
  wrap.classList.add('swipe');
  let x0 = null, dx = 0, id = null;
  const lean = () => btns.forEach(b => b.classList.toggle('lean', Math.abs(dx) > 60 && ((b.dataset.v === 'true') === (dx > 0))));
  wrap.addEventListener('pointerdown', e => { if (!wrap.classList.contains('swipe')) return; x0 = e.clientX; id = e.pointerId; wrap.classList.remove('snap'); try { wrap.setPointerCapture(id); } catch (err) {} });
  wrap.addEventListener('pointermove', e => {
    if (x0 === null) return;
    dx = e.clientX - x0;
    screen.style.transform = 'translateX(' + dx.toFixed(1) + 'px) rotate(' + (dx / 28).toFixed(2) + 'deg)';
    lean();
  });
  const up = () => {
    if (x0 === null || !wrap.classList.contains('swipe')) { x0 = null; return; }
    x0 = null;
    const pick = Math.abs(dx) > 90 ? (dx > 0) : null;
    btns.forEach(b => b.classList.remove('lean'));
    wrap.classList.add('snap');
    if (pick === null) { screen.style.transform = ''; dx = 0; return; }
    screen.style.transform = 'translateX(' + (pick ? 40 : -40) + 'px) rotate(' + (pick ? 2 : -2) + 'deg)';
    wrap.classList.remove('swipe');   /* one swipe per question: the handlers stay bound but go inert */
    commit(q, { value: pick }, btns.find(b => (b.dataset.v === 'true') === pick));
  };
  wrap.addEventListener('pointerup', up); wrap.addEventListener('pointercancel', up);
}

/* the shared beat: lock everything, drumroll, grade, reveal, then the feedback */
async function commit(q, payload, focusEl) {
  const stage = document.querySelector('.stage'); if (!stage || stage.dataset.done) return;
  stage.dataset.done = '1';   /* one answer per question, whatever gesture arrives next */
  stage.querySelectorAll('button').forEach(b => { if (!b.classList.contains('quit') && b.id !== 'sheetbtn') b.onclick = null; });
  const usher = document.getElementById('usher'); if (usher) usher.disabled = true;
  if (focusEl) focusEl.classList.add('picked');
  S.drum();
  let data;
  try {
    [data] = await Promise.all([
      api('/api/answer', Object.assign({ slug: currentSlug, sid, qid: q.qid }, payload)),
      wait(REDUCE() ? 0 : 640)]);
  } catch (e) { if (focusEl) focusEl.classList.remove('picked'); return; }
  if (focusEl) focusEl.classList.remove('picked');
  if (data.error) { go('#/film/' + currentSlug); return; }
  revealFor(q, data, payload, stage, focusEl);
  afterAnswer(data, focusEl);
}

function revealFor(q, data, payload, stage, focusEl) {
  const t = q.type || 'mc';
  if (t === 'mc') {
    const all = [...stage.querySelectorAll('.opt')];
    all.forEach((b, j) => {
      if (j === data.correct_index) { b.classList.add('correct'); b.querySelector('.letter').textContent = '★'; }
      else if (j === payload.choice) b.classList.add('wrong');
      else if (!b.classList.contains('out')) b.classList.add('dim');
    });
  } else if (t === 'blank') {
    const slot = stage.querySelector('#slot');
    slot.classList.add(data.correct ? 'right' : 'wrong');
    stage.querySelectorAll('.tile').forEach((b, j) => {
      if (j === data.correct_index) { b.classList.remove('used'); b.classList.add('correct'); }
      else if (j !== payload.choice) b.classList.add('dim');
    });
    if (!data.correct) slot.innerHTML = '<s>' + esc(q.options[payload.choice]) + '</s> ' + esc(q.options[data.correct_index]);
  } else if (t === 'who') {
    stage.querySelectorAll('.facebtn').forEach((b, j) => {
      if (j === data.correct_index) b.classList.add('correct');
      else if (j === payload.choice) b.classList.add('wrong');
      else if (!b.classList.contains('out')) b.classList.add('dim');
    });
  } else if (t === 'tf') {
    stage.querySelectorAll('.tfbtn').forEach(b => {
      const v = b.dataset.v === 'true';
      if (v === data.answer) b.classList.add('correct'); else b.classList.add(v === payload.value ? 'wrong' : 'dim');
    });
    const wrap = stage.querySelector('.screenwrap'); wrap.classList.remove('swipe'); wrap.classList.add('snap');
    stage.querySelector('.screen').style.transform = '';
    const hint = stage.querySelector('.tfhint'); if (hint) hint.textContent = data.answer ? 'It is true' : 'It is false';
  } else if (t === 'order') {
    const slots = [...stage.querySelectorAll('.oslot')];
    slots.forEach((sl, k) => sl.classList.add(payload.order[k] === data.correct_order[k] ? 'right' : 'wrong'));
    stage.querySelector('#lockrow').classList.add('hidden');
    if (!data.correct) {
      stage.querySelector('.bank').innerHTML = '';
      stage.querySelector('.slots').insertAdjacentHTML('afterend', '<div class="truth"><b>The real order:</b><ol>' +
        data.correct_order.map(j => '<li>' + esc(q.items[j]) + '</li>').join('') + '</ol></div>');
    }
  } else if (t === 'number') {
    const needle = stage.querySelector('#needle'), readout = stage.querySelector('#readout'), note = stage.querySelector('#dialnote');
    stage.querySelector('#lockrow').classList.add('hidden');
    readout.classList.add(data.correct ? 'right' : 'wrong');
    if (!data.correct) {
      needle.classList.add('snap');
      requestAnimationFrame(() => { needle.style.transform = 'rotate(' + gaugeAngle(data.answer, q.min, q.max).toFixed(2) + 'deg)'; });
      setTimeout(() => { readout.innerHTML = fmtNum(data.answer, q.unit); readout.classList.remove('wrong'); readout.classList.add('right'); S.arrive(); }, REDUCE() ? 0 : 700);
      note.innerHTML = 'You said <b>' + esc(payload.value) + '</b>. The needle shows the real answer.';
    } else note.innerHTML = '<b>Dead on.</b>';
  } else if (t === 'spot') {
    const wrap = stage.querySelector('#spot');
    stage.querySelector('#lockrow').classList.add('hidden');
    const pin = wrap.querySelector('.pin'); if (pin) pin.classList.add(data.correct ? 'right' : 'wrong');
    const h = wrap.querySelector('.ring.hint'); if (h) h.remove();
    (data.targets || []).forEach(([cx, cy, r]) => {
      wrap.appendChild($('<div class="ring" style="left:' + (cx * 100) + '%;top:' + (cy * 100) + '%;width:' + (r * 200) + '%"></div>'));
    });
    stage.querySelector('#spotnote').textContent = data.correct ? 'Found it!' : 'It was inside the green ring.';
  }
}

function afterAnswer(data, focusEl) {
  if (data.correct) {
    streak++;
    S.correct(streak - 1);
    const r = (focusEl || document.querySelector('.screen')).getBoundingClientRect();
    burst({ count: streak >= 5 ? 60 : 26, x: r.left + r.width / 2, y: r.top + r.height / 2, gold: true });
    if (streak === 5) setTimeout(() => S.blaze(), 220);
  } else {
    streak = 0;
    S.wrong();
  }
  results.push(data.correct ? 'right' : 'wrong');
  const stage = document.querySelector('.stage');
  if (stage) stage.className = 'stage heat' + heatFor(streak);
  const st = document.getElementById('streak'), sn = document.getElementById('streakn');
  if (sn) sn.textContent = streakLabel();
  if (st) st.classList.toggle('on', streak >= 2);
  document.querySelectorAll('.tix i').forEach((el, idx) => { el.className = results[idx] || (idx === qIndex + 1 ? 'now' : ''); });
  const last = data.answered >= data.total;
  const fb = document.getElementById('feedback');
  fb.innerHTML = '<div class="explain">' + (data.correct ? '<b>Right!</b> ' : '') + esc(data.explain || '') + '</div>' +
    '<button class="big" id="nextbtn">' + (last ? 'Roll the credits' : 'Next question') + ICON.arrow + '</button>';
  const next = document.getElementById('nextbtn');
  next.onclick = () => { S.tap(); if (data.final) showTally(data.final); else renderQuestion(qIndex + 1, results); };
  next.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function renderQuestion(i, res) {
  results = res; qIndex = i;
  setMode('focus'); setRoom('auditorium'); scrollTop();
  const q = questions[i], t = q.type || 'mc';
  main.innerHTML = '';
  const qtext = t === 'blank'
    ? esc(q.q).replace('____', '<span class="slot" id="slot">&nbsp;</span>')
    : esc(q.q);
  const canUsher = t !== 'tf';
  const stage = $('<div class="stage heat' + heatFor(streak) + '">' +
    '<div class="qtop"><div class="playing">' + avHTML(playingAs) + (playingAs ? esc(playingAs) + ' is playing' : 'Everyone together') + '</div>' +
      '<span class="streak' + (streak >= 2 ? ' on' : '') + '" id="streak">' + ICON.flame +
      '<span id="streakn">' + streakLabel() + '</span></span></div>' +
    tix(results, questions.length, i) +
    '<div class="qhead"><span class="qcount">Question ' + (i + 1) + ' of ' + questions.length + '</span>' +
      '<div class="qtools"><button class="usher" id="sheetbtn">' + ICON.film + '<span class="lbl">Fact sheet</span></button>' +
      '<button class="usher" id="usher"' + (hintUsed || !canUsher ? ' disabled' : '') + '>' + ICON.torch + '<span class="lbl">' +
        (!canUsher ? 'No usher here' : hintUsed ? 'Usher used' : 'Usher, help!') + '</span></button></div></div>' +
    '<div class="screenwrap"><div class="flames">' + FLAMES + '</div>' +
      '<div class="screen"><div class="qkind">' + ICON.magic + esc(KIND[t] || '') + '</div><div class="qtext">' + qtext + '</div></div></div>' +
    bodyFor(q) +
    '<div id="feedback"></div></div>');
  main.appendChild(stage);
  const quit = $('<button class="quit">' + ICON.x + 'Leave</button>');
  quit.onclick = async () => { S.tap(); if (await leaveCheck()) go('#/film/' + currentSlug); };
  main.appendChild(quit);
  stagger(stage);
  wireType(q, stage);
  stage.querySelector('#usher').onclick = () => useHint(q);
  stage.querySelector('#sheetbtn').onclick = () => openSheet();
}

/* the usher, per type */
async function useHint(q) {
  const b = document.getElementById('usher');
  if (!b || b.disabled) return;
  b.disabled = true; S.hint();
  const d = await api('/api/hint', { slug: currentSlug, sid, qid: q.qid });
  if (d.error) { b.innerHTML = ICON.torch + '<span class="lbl">Usher is busy</span>'; return; }
  hintUsed = true;
  const stage = document.querySelector('.stage'); if (!stage) return;
  const t = q.type || 'mc';
  if (t === 'mc' || t === 'blank' || t === 'who') {
    const host = stage.querySelector('.opts, .tiles, .faces4');
    host.appendChild($('<div class="torch"></div>'));
    await wait(REDUCE() ? 0 : 520);
    const o = host.querySelector('[data-j="' + d.remove + '"]');
    if (o) { o.classList.add('out'); o.onclick = null; const L = o.querySelector('.letter'); if (L) L.textContent = 'X'; }
  } else if (t === 'order') {
    const tl = stage.querySelector('.bank .tile[data-j="' + d.first + '"]');
    if (tl) tl.insertAdjacentHTML('beforeend', '<span class="first">1st</span>');
  } else if (t === 'number') {
    const band = stage.querySelector('#band');
    if (band) { band.setAttribute('d', arcPath(gaugeAngle(d.lo, q.min, q.max), gaugeAngle(d.hi, q.min, q.max), 80)); band.classList.add('on'); }
    const note = stage.querySelector('#dialnote');
    if (note) note.innerHTML = 'The usher whispers: somewhere between <b>' + esc(Math.round(d.lo)) + '</b> and <b>' + esc(Math.round(d.hi)) + '</b>';
  } else if (t === 'spot') {
    const [cx, cy, r] = d.ring;
    stage.querySelector('#spot').appendChild($('<div class="ring hint" style="left:' + (cx * 100) + '%;top:' + (cy * 100) + '%;width:' + (r * 200) + '%"></div>'));
  }
  b.innerHTML = ICON.torch + '<span class="lbl">Usher used</span>';
}

/* the box office: every ticket counted one at a time, then the verdict */
function showTally(final) {
  setMode('focus'); setRoom('auditorium'); scrollTop();
  main.innerHTML = '';
  const total = questions.length, score = final.score;
  const card = $('<div class="panel pad tally"><span class="k">Box office</span>' +
    '<div class="count"><span id="tn">0</span><small> of ' + total + '</small></div>' +
    '<div class="tix" id="ttix">' + '<i></i>'.repeat(total) + '</div>' +
    '<div class="verdict" id="verdict"></div></div>');
  main.appendChild(card);
  stagger(main);
  const tn = card.querySelector('#tn'), cells = [...card.querySelectorAll('#ttix i')], v = card.querySelector('#verdict');
  const step = REDUCE() ? 0 : 200;
  let n = 0, done = false;
  async function verdict() {
    const who = final.who || playingAs;
    const near = score >= passScore - 1 ? 'So close!' : score >= total / 2 ? 'Almost there!' : 'Good try!';
    v.textContent = final.passed ? (who ? who + ' did it!' : 'You did it!') : near;
    v.classList.add('on'); if (final.passed) v.classList.add('win');
    if (who && stickersBefore) {
      try {
        const now = (await stickerSet(who)).ids;
        const fresh = now.filter(id => !stickersBefore.includes(id));
        fresh.slice(0, 2).forEach((id, i) => {
          const st = STICKERS.find(x => x.id === id);
          const el = $('<div class="newsticker"><div class="disc">' + ICON[st.icon] + '</div><div><span class="k">New sticker</span><b>' + esc(st.name) + '</b></div></div>');
          el.style.animationDelay = (0.3 + i * 0.25) + 's';
          card.appendChild(el);
        });
        if (fresh.length) { S.correct(6); burst({ count: 50, y: innerHeight * 0.5 }); }
      } catch (e) {}
    }
    if (final.passed) { S.drumroll(); setTimeout(() => celebrate(final), REDUCE() ? 0 : 1150); }
    else { S.thud(); setTimeout(() => showCooldown({ slug: currentSlug }, final.cooldown, score), REDUCE() ? 0 : 1700); }
  }
  const finish = () => {
    if (done) return; done = true; clearTimeout(fs);
    tn.textContent = score; cells.forEach((el, k) => { el.className = results[k] || ''; });
    verdict();
  };
  const fs = setTimeout(finish, step * total + 1500);
  (function tick(k) {
    if (done) return;
    if (!document.body.contains(card)) { done = true; clearTimeout(fs); return; }
    if (k >= total) return finish();
    cells[k].className = results[k] || '';
    if (results[k] === 'right') { n++; tn.textContent = n; S.tick(); } else S.thud();
    setTimeout(() => tick(k + 1), step);
  })(0);
}

function starRow(score, total) {
  const filled = Math.max(0, Math.min(5, Math.round(5 * score / total)));
  return '<div class="stars">' + '★'.repeat(filled) + '☆'.repeat(5 - filled) + '</div>';
}

/* ---------- the unlock celebration: the whole point of the app ---------- */
function celebrate(final) {
  setMode('focus'); setRoom('auditorium');
  const slug = currentSlug;
  const encore = !wasLocked;   /* they already owned this poster: celebrate, but briefly */
  const who = final.who || playingAs;
  const c = $('<div class="celebrate">' +
    '<div class="beam"></div>' +
    '<div class="curtain l"></div><div class="curtain r"></div>' +
    '<div class="reveal">' +
      '<div class="posterhold">' + framed(posterImg(slug, 'Your poster')) + '</div>' +
      '<div class="unlocktitle">Poster Earned!</div>' +
      '<div class="unlockby">' + (who ? esc(who) + ' opened the vault for the whole family.' : 'The vault is open for the whole family.') + '</div>' +
      '<div class="actions">' +
        '<button class="big" id="cprint">' + ICON.print + (final.printed ? 'Print another copy' : 'Print my poster') + '</button>' +
        '<button class="big ghost" id="cback">Back to the film</button>' +
      '</div>' +
    '</div></div>');
  if (encore) {
    c.querySelectorAll('.curtain').forEach(el => el.remove());
    c.querySelector('.posterhold').style.animationDelay = '80ms';
    c.querySelector('.unlocktitle').style.animationDelay = '420ms';
    c.querySelector('.unlocktitle').textContent = 'Nailed it again!';
    c.querySelector('.unlockby').textContent = who ? who + ' still has it.' : 'Still got it.';
    c.querySelector('.unlockby').style.animationDelay = '640ms';
    c.querySelector('.actions').style.animationDelay = '760ms';
  }
  document.body.appendChild(c);

  if (encore) {
    S.fanfare();
    setTimeout(() => burst({ count: 110, gold: true, y: innerHeight * 0.4 }), 150);
  } else {
    S.drumroll();
    setTimeout(() => S.swish(), 300);
    setTimeout(() => { S.fanfare(); burst({ count: 170, gold: true, y: innerHeight * 0.38 }); }, 1000);
    setTimeout(() => burst({ count: 90, y: innerHeight * 0.5 }), 1700);
  }

  c.querySelector('#cprint').onclick = () => { S.tap(); c.remove(); showPrintFlow({ slug }, final.printed); };
  c.querySelector('#cback').onclick = () => { S.tap(); c.remove(); go('#/film/' + slug); };
}

function showCooldown(f, seconds, score) {
  setMode('browse'); setRoom('auditorium'); scrollTop();
  main.innerHTML = '';
  const total = questions.length || 10;
  const who = playingAs;
  const head = (score !== undefined)
    ? starRow(score, total) + '<div class="bigscore">' + score + '/' + total + '</div>' +
      '<p class="note">' + (score >= passScore - 1 ? 'One more and the vault opens.' : 'You need ' + passScore + ' to open the vault.') +
      (who ? ' Nice work, ' + esc(who) + '.' : '') + '</p>'
    : '<div class="h2">The projector is rewinding...</div>';
  const card = $('<div class="panel pad center cool">' + head +
    '<p class="note gap">Grab your film study sheet and read it over. The projector is ready again in:</p>' +
    '<div class="countdown" id="cd"></div>' +
    '<button class="big" id="retry" disabled>Try again</button>' +
    '<button class="big ghost" id="readsheet">' + ICON.film + 'Read the fact sheet</button>' +
    '<button class="big ghost" id="back">Back to the film</button>' +
    '</div>');
  main.appendChild(card);
  stagger(main);
  loadSheet(f.slug);
  document.getElementById('readsheet').onclick = () => openSheet();
  document.getElementById('back').onclick = () => { S.tap(); go('#/film/' + f.slug); };

  let left = seconds;
  const cd = document.getElementById('cd');
  (function tick() {
    if (!document.body.contains(cd)) return;
    if (left <= 0) {
      cd.textContent = 'Ready!';
      const b = document.getElementById('retry');
      if (b) { b.disabled = false; b.onclick = () => { S.tap(); startQuiz({ slug: f.slug }); }; }
      return;
    }
    cd.textContent = Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0');
    if (left <= 5) S.tick();
    left--;
    setTimeout(tick, 1000);
  })();
}

/* ==========================================================================
   PRINT FLOW. Parent code is asked FIRST, before the paper instructions.
   ========================================================================== */
async function showPrintFlow(f, needCode) {
  let parentCode = null;
  if (needCode) {
    parentCode = await askCode('This poster was already printed once. A parent can enter the code to print another copy.');
    if (!parentCode) { go('#/film/' + f.slug); return; }
  }
  setMode('browse'); setRoom('booth'); scrollTop();
  main.innerHTML = '';
  const card = $('<div class="paper pad">' +
    '<div class="h2 center">Mission: print the poster</div>' +
    '<ol class="instructions gap">' +
      '<li>Find the big <b>13 by 19 poster paper</b> (ask a grown up where it lives).</li>' +
      '<li>Load it in the <b>rear tray</b> on the back of the printer.</li>' +
      '<li>Bright side <b>facing you</b>, guides snug against the paper.</li>' +
      '<li>When it is loaded, press the big button!</li>' +
    '</ol>' +
    '<button class="big" id="go">' + ICON.print + 'The paper is loaded. Print it!</button>' +
    '<div class="note center gap" id="pnote"></div>' +
    '<button class="big ghost" id="back">Back</button>' +
    '</div>');
  main.appendChild(card);
  stagger(main);
  document.getElementById('back').onclick = () => { S.tap(); go('#/film/' + f.slug); };
  document.getElementById('go').onclick = async () => {
    const btn = document.getElementById('go');
    const note = document.getElementById('pnote');
    btn.disabled = true; btn.textContent = 'Sending to the printer...';
    S.printing();
    let data = await api('/api/print', parentCode ? { slug: f.slug, parent_code: parentCode } : { slug: f.slug });
    if (data.error === 'already_printed') {
      const code = await askCode('This poster was already printed once. A parent can enter the code to print another copy.');
      if (code) data = await api('/api/print', { slug: f.slug, parent_code: code });
    }
    if (data.ok) {
      btn.textContent = 'Printing! Go watch it come out!';
      note.textContent = 'Job ' + (data.job || 'sent') + '. High quality takes a couple of minutes.';
      S.fanfare(); burst({ count: 120 });
    } else {
      btn.disabled = false; btn.textContent = 'The paper is loaded. Print it!';
      note.textContent = (data.error === 'already_printed')
        ? 'That parent code was not right. Ask a grown up and try again.'
        : (data.error || 'Something went wrong. Tell a grown up.');
    }
  };
}

route();
ensureKids().then(paintWho);
intro();
